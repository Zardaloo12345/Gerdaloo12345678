<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو مینی (هزار موضوع + عکس)</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 15px; background: #1e293b; text-align: center; font-weight: bold; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 5px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.6; animation: fade 0.3s; white-space: pre-wrap; }
    .bot { background: #fff; color: #0f172a; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: linear-gradient(135deg, #1e40af, #38bdf8); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
    
    /* استایل برای عکس تولید شده */
    .generated-img { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

    .input-box { padding: 12px 15px; margin: 0 15px 60px 15px; background: #1e293b; display: flex; gap: 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: #334155; color: #fff; font-size: 14px; }
    button { padding: 10px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button:hover { background: #d97706; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>گردآلو مینی (موضوعات + ساخت عکس)</header>
  
  <div id="chat">
    <div class="msg bot">سلام! من گردآلو هستم. می‌تونم درباره هزاران موضوع بهت جواب بدم. همچنین برای ساخت عکس، بنویس: <b>«عکس بساز: [توصیف تصویر]»</b> 🎨</div>
  </div>

  <div class="input-box">
    <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
    <button id="btn">ارسال</button>
  </div>

  <script>
    // ====== دیکشنری پایه ======
    const baseKb = {
      "مسی": "لیونل مسی، اسطوره آرژانتینی و برنده ۸ توپ طلا، بهترین بازیکن تاریخ فوتبال است. 🇦🇷⚽",
      "رونالدو": "کریستیانو رونالدو، ستاره پرتغالی، یکی از بهترین گلزنان تاریخ و برنده ۵ توپ طلا است. 🇵🇹⚽",
      "امباپه": "کیلیان امباپه، مهاجم سرعتی و گلزن فرانسوی است که در رئال مادرید بازی می‌کند. 🇫🇷⚽",
      "تربیت بچه": "تربیت کودک نیازمند صبر و محبت است. گوش دادن به کودک، تعیین قوانین منطقی و تشویق رفتارهای خوب، پایه‌های یک تربیت سالم هستند. 👶",
      "سلام": "سلام! خوشحالم که باهام حرف میزنی 😊 چطور می‌تونم کمکت کنم؟",
      "برنامه نویسی": "برنامه‌نویسی یعنی نوشتن دستورات برای کامپیوتر. شروع با پایتون بهترین راه است. 🧑🏻‍💻",
      "هوش مصنوعی": "هوش مصنوعی یعنی آموزش کامپیوتر برای انجام کارهای هوشمند. 🤖",
      "کسب و کار": "برای شروع کسب‌وکار، نیاز بازار را بسنج و با کمترین سرمایه شروع کن. 💼",
      "روانشناسی": "روانشناسی علم مطالعه ذهن و رفتار انسان است. 🧠",
      "سلامتی": "سلامتی تاجی است که فقط بیماران آن را می‌بینند. با تغذیه سالم و ورزش قدردانش باش. ❤️",
      "کتاب": "کتاب بهترین دوست انسان است. 📚",
      "شعر": "شعر زبان دل است. حافظ و سعدی از بزرگترین شاعران ایرانی هستند. 📜",
      "موسیقی": "موسیقی زبان جهانی احساسات است. 🎸",
      "ورزش": "ورزش روزانه حتی ۳۰ دقیقه پیاده‌روی، سلامت قلب را تضمین می‌کند. 🏃",
      "زبان انگلیسی": "با تمرین روزانه و تماشای فیلم می‌توانی انگلیسی یاد بگیری. 🇬🇧"
    };

    // ====== تولید ۱۰۰۰+ موضوع ======
    const finalKb = { ...baseKb };
    const subjects = ["هوش مصنوعی", "برنامه نویسی", "کسب و کار", "روانشناسی", "سلامتی", "آشپزی", "تاریخ", "فضا", "کتاب", "شعر", "موسیقی", "ورزش", "ریاضی", "زبان انگلیسی", "تربیت بچه", "فوتبال", "مسی", "رونالدو", "امباپه", "نیمار"];
    const actions = ["چیه", "چیست", "چطور کار می‌کند", "چه فایده‌ای دارد", "چگونه شروع کنم", "بهترین روش چیست", "مزایا و معایب", "نکات مهم", "اشتباهات رایج", "چطور بهتر شود"];

    subjects.forEach(sub => {
      actions.forEach(act => {
        const key = `${sub} ${act}`;
        if (!finalKb[key]) {
          finalKb[key] = `درباره «${sub}»: بهترین راه این است که از منابع معتبر یاد بگیری و تمرین کنی. 🍑`;
        }
      });
    });

    const chat = document.getElementById('chat');
    const input = document.getElementById('i');
    const btn = document.getElementById('btn');

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';

      // ====== تشخیص درخواست ساخت عکس ======
      if (text.includes("عکس بساز") || text.includes("تصویر بساز")) {
        const prompt = text.replace("عکس بساز:", "").replace("تصویر بساز:", "").replace("عکس بساز", "").trim();
        
        if (prompt) {
          chat.innerHTML += `<div class="msg bot">در حال ساخت تصویر برای: "${prompt}" 🎨...</div>`;
          chat.scrollTop = chat.scrollHeight;

          // استفاده از API رایگان Pollinations
          const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
          
          setTimeout(() => {
            chat.innerHTML += `<div class="msg bot">این هم عکس شما:<br><img src="${imageUrl}" class="generated-img" alt="${prompt}"></div>`;
            chat.scrollTop = chat.scrollHeight;
          }, 1000);
          return;
        }
      }

      // ====== جستجو در دیکشنری متنی ======
      let reply = "متأسفم، هنوز درباره این موضوع چیزی یاد نگرفته‌ام 🍑";
      for (const key in finalKb) {
        if (text.includes(key)) {
          reply = finalKb[key];
          break;
        }
      }

      setTimeout(() => {
        chat.innerHTML += `<div class="msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 400);

      chat.scrollTop = chat.scrollHeight;
    }

    btn.onclick = sendMessage;

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
