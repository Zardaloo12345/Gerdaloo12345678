<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو | متصل به Puter AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <!-- این خط جادویی است: کتابخانه Puter را لود می‌کند -->
  <script src="https://js.puter.com/v2/"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 15px; background: #1e293b; text-align: center; font-weight: bold; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 5px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; animation: fade 0.3s; white-space: pre-wrap; word-break: break-word; }
    .bot { background: #fff; color: #0f172a; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: linear-gradient(135deg, #1e40af, #38bdf8); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
    .input-box { padding: 12px 15px; margin: 0 15px 60px 15px; background: #1e293b; display: flex; gap: 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: #334155; color: #fff; font-size: 14px; }
    button#send { padding: 10px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button#send:disabled { background: #64748b; cursor: not-allowed; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>گردآلو (متصل به gpt-5.6-luna)</header>
  
  <div id="chat">
    <div class="msg bot">سلام! من گردآلو هستم. حالا به یک هوش مصنوعی واقعی (Puter) وصل شدم. هر سوالی داری بپرس! (بار اول ممکن است پنجره ورود Puter باز شود) 🍑🚀</div>
  </div>

  <div class="input-box">
    <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
    <button id="send" onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    
    // آرایه تاریخچه برای حفظ حافظه چت
    let history = [
        { role: "system", content: "تو گردآلو هستی، یک دستیار هوشمند فارسی‌زبان. پاسخ‌هایت کامل، دقیق و با لحنی صمیمی باشد." }
    ];

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // نمایش پیام کاربر
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // افزودن به تاریخچه
      history.push({ role: "user", content: text });

      // غیرفعال کردن دکمه ارسال
      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      // ساخت حباب پیام برای ربات (خالی در ابتدا)
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.innerHTML = '<span style="color: #f59e0b;">در حال فکر کردن...</span>';
      chat.appendChild(botMsgDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        // فراخوانی Puter با مدل درخواستی شما و فعال‌سازی استریم (تایپ کلمه به کلمه)
        const response = await puter.ai.chat(history, {
            model: "gpt-5.6-luna",
            stream: true 
        });

        botMsgDiv.innerHTML = ''; // پاک کردن متن "در حال فکر کردن"
        let fullReply = '';

        // خواندن استریم و نمایش کلمه به کلمه
        for await (const part of response) {
            if (part?.text) {
                fullReply += part.text;
                // تبدیل خطوط جدید به تگ br برای نمایش درست در HTML
                botMsgDiv.innerHTML = fullReply.replace(/\n/g, '<br>');
                chat.scrollTop = chat.scrollHeight;
            }
        }

        // افزودن پاسخ کامل به تاریخچه
        history.push({ role: "assistant", content: fullReply });

      } catch (error) {
        botMsgDiv.innerHTML = 'خطا در اتصال به هوش مصنوعی. لطفاً اینترنت خود را بررسی کنید یا دوباره تلاش کنید.';
        console.error(error);
      } finally {
        // فعال کردن مجدد دکمه
        sendBtn.disabled = false;
        sendBtn.textContent = "ارسال";
        chat.scrollTop = chat.scrollHeight;
      }
    }

    // ارسال با زدن Enter
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
