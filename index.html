<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو | اتصال به DeepSeek</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 15px; background: #1e293b; text-align: center; font-weight: bold; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 5px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; animation: fade 0.3s; white-space: pre-wrap; word-break: break-word; }
    .bot { background: #fff; color: #0f172a; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: linear-gradient(135deg, #1e40af, #38bdf8); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
    
    /* استایل باکس تفکر (Thinking) */
    .thinking-box { background: #1e293b; color: #94a3b8; font-size: 12px; padding: 10px; border-radius: 8px; margin-bottom: 5px; border-right: 3px solid #f59e0b; font-style: italic; width: 100%; }
    .thinking-title { font-weight: bold; color: #f59e0b; margin-bottom: 5px; font-style: normal; font-size: 11px; }

    .input-box { padding: 12px 15px; margin: 0 15px 60px 15px; background: #1e293b; display: flex; gap: 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: #334155; color: #fff; font-size: 14px; }
    button#send { padding: 10px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button#send:disabled { background: #64748b; cursor: not-allowed; }
    
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>گردآلو (متصل به DeepSeek)</header>
  
  <div id="chat">
    <div class="msg bot">سلام! من گردآلو هستم. حالا به مدل DeepSeek مجهز شدم و می‌تونم با تفکر عمیق به سوالاتت جواب بدم. چی می‌خوای بدونی؟ 🍑</div>
  </div>

  <div class="input-box">
    <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
    <button id="send" onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    // ⚠️ کلید API خود را اینجا وارد کنید ⚠️
    const API_KEY = "YOUR_DEEPSEEK_API_KEY"; 
    const API_URL = "https://api.deepseek.com/chat/completions";
    const MODEL = "deepseek-flash";

    const chat = document.getElementById('chat');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    let history = []; // برای حفظ حافظه چت

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // نمایش پیام کاربر
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // افزودن به تاریخچه
      history.push({ role: "user", content: text });

      // غیرفعال کردن دکمه ارسال
      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      // نمایش وضعیت تایپ
      const typingDiv = document.createElement('div');
      typingDiv.className = 'msg bot';
      typingDiv.innerHTML = '<span class="typing" style="color:#f59e0b">در حال تفکر و پردازش...</span>';
      chat.appendChild(typingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: "system", content: "تو گردآلو هستی، یک دستیار هوشمند فارسی‌زبان. پاسخ‌هایت کامل، دقیق و با لحنی صمیمی باشد. همیشه به زبان فارسی جواب بده." },
              ...history
            ],
            // فعال‌سازی قابلیت تفکر عمیق
            thinking: { type: "enabled" },
            reasoning_effort: "high",
            stream: false
          })
        });

        const data = await response.json();
        typingDiv.remove();

        if (data.choices && data.choices[0]) {
          const message = data.choices[0].message;
          const reply = message.content;
          const reasoning = message.reasoning_content; // بخش تفکر مدل

          let htmlResponse = '';

          // اگر مدل فرآیند تفکر داشت، آن را در یک باکس نمایش بده
          if (reasoning) {
            htmlResponse += `
              <div class="thinking-box">
                <div class="thinking-title">🧠 فرآیند تفکر DeepSeek:</div>
                ${reasoning.replace(/\n/g, '<br>')}
              </div>
            `;
          }

          // نمایش پاسخ نهایی
          htmlResponse += `<div class="msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
          chat.innerHTML += htmlResponse;

          history.push({ role: "assistant", content: reply });
        } else {
          chat.innerHTML += `<div class="msg bot">خطا در دریافت پاسخ از هوش مصنوعی.</div>`;
        }

      } catch (error) {
        typingDiv.remove();
        chat.innerHTML += `<div class="msg bot">ارتباط برقرار نشد. کلید API یا اتصال اینترنت را بررسی کنید.</div>`;
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "ارسال";
        chat.scrollTop = chat.scrollHeight;
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
