<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو </title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <style>
    /* ====== متغیرهای رنگ ====== */
    :root {
      --bg-main: #0f172a;
      --bg-header: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-input: #1e293b;
      --bg-input-field: #334155;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #f59e0b;
      
      --user-msg-bg: #1e40af;
      --bot-msg-bg: #ffffff;
      --bot-msg-text: #0f172a;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-header: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-input: #ffffff;
      --bg-input-field: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }

    /* ===== نوار کناری (تاریخچه) ===== */
    #sidebar {
      width: 280px; background: var(--bg-sidebar); height: 100vh;
      position: fixed; top: 0; right: 0; z-index: 1000;
      transform: translateX(100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column; border-left: 1px solid var(--border-color);
    }
    #sidebar.open { transform: translateX(0); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    #overlay.open { display: block; }

    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; color: var(--accent); }
    .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .new-chat-btn { margin: 15px; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .new-chat-btn:hover { background: #d97706; }

    .history-list { flex: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
    
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; margin-bottom: 8px; background: var(--bg-main);
      border-radius: 8px; font-size: 13px; color: var(--text-muted);
      cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .history-item:hover { background: var(--border-color); }
    .history-item.active { border-color: var(--accent); background: var(--border-color); color: var(--text-main); }
    .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
    
    .delete-chat-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; display: none; padding: 2px 5px; border-radius: 4px; }
    .delete-chat-btn:hover { background: rgba(239, 68, 68, 0.2); }
    .history-item:hover .delete-chat-btn { display: block; }

    /* ===== بخش اصلی ===== */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; position: relative; }
    
    header {
      padding: 15px; background: var(--bg-header); color: var(--accent); font-weight: bold; font-size: 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .menu-btn, .settings-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }

    /* صفحه خوش‌آمدگویی */
    #welcome-screen {
      flex: 1; display: flex; justify-content: center; align-items: center;
      text-align: center; padding: 20px; animation: fade 0.5s;
    }
    #welcome-screen h1 { font-size: 32px; font-weight: bold; color: var(--text-main); line-height: 1.5; }

    #chat { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 10px; }
    
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; animation: fade 0.3s; white-space: pre-wrap; word-break: break-word; }
    
    .bot { background: var(--bot-msg-bg); color: var(--bot-msg-text); align-self: flex-start; border-top-left-radius: 2px; border: 1px solid var(--border-color); }
    .user { background: var(--user-msg-bg); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }

    /* نوار ورودی */
    .input-box { padding: 12px 15px; margin: 0 15px 60px 15px; background: var(--bg-input); display: flex; gap: 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-color); }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: var(--bg-input-field); color: var(--text-main); font-size: 14px; }
    button#send { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; font-size: 14px; }
    button#send:disabled { background: #64748b; cursor: not-allowed; }

    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== مودال تنظیمات ساده ===== */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--bg-header); padding: 25px; border-radius: 16px; width: 100%; max-width: 350px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content h3 { color: var(--accent); margin-bottom: 20px; text-align: center; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .setting-row:last-child { border-bottom: none; margin-bottom: 20px; }
    .setting-row input[type="color"] { width: 40px; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: none; }
    .setting-row button { background: var(--bg-input-field); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .btn-close-settings { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- نوار کناری -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>تاریخچه چت‌ها</h2>
      <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ چت جدید</button>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- بخش اصلی -->
  <div class="main-content">
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span>گردآلو</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>
    
    <div id="welcome-screen">
      <h1>چطور می‌تونم کمکتون کنم؟</h1>
    </div>

    <div id="chat"></div>

    <div class="input-box">
      <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
      <button id="send" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <!-- مودال تنظیمات -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>تنظیمات ظاهری</h3>
      
      <div class="setting-row">
        <span>حالت تاریک/روشن</span>
        <button onclick="toggleTheme()" id="theme-btn">تغییر</button>
      </div>

      <div class="setting-row">
        <span>رنگ پیام‌های شما</span>
        <input type="color" id="color-user" oninput="applyCustomColors()">
      </div>

      <div class="setting-row">
        <span>رنگ پیام‌های گردآلو</span>
        <input type="color" id="color-bot" oninput="applyCustomColors()">
      </div>

      <div class="setting-row">
        <span>رنگ متن گردآلو</span>
        <input type="color" id="color-font" oninput="applyCustomColors()">
      </div>

      <button class="btn-close-settings" onclick="closeSettings()">بستن</button>
    </div>
  </div>

  <script>
    // ====== متغیرهای اصلی ======
    const chatContainer = document.getElementById('chat');
    const welcomeScreen = document.getElementById('welcome-screen');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    const historyList = document.getElementById('history-list');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    let chats = JSON.parse(localStorage.getItem('gerdaloo_history')) || [];
    let currentChatId = null;

    // ====== تنظیمات ======
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('gerdaloo_theme', isLight ? 'light' : 'dark');
    }

    function applyCustomColors() {
      const colorUser = document.getElementById('color-user').value;
      const colorBot = document.getElementById('color-bot').value;
      const colorFont = document.getElementById('color-font').value;

      document.documentElement.style.setProperty('--user-msg-bg', colorUser);
      document.documentElement.style.setProperty('--bot-msg-bg', colorBot);
      document.documentElement.style.setProperty('--bot-msg-text', colorFont);

      localStorage.setItem('gerdaloo_color_user', colorUser);
      localStorage.setItem('gerdaloo_color_bot', colorBot);
      localStorage.setItem('gerdaloo_color_font', colorFont);
    }

    function loadSettings() {
      if (localStorage.getItem('gerdaloo_theme') === 'light') {
        document.body.classList.add('light-mode');
      }
      const cUser = localStorage.getItem('gerdaloo_color_user') || '#1e40af';
      const cBot = localStorage.getItem('gerdaloo_color_bot') || '#ffffff';
      const cFont = localStorage.getItem('gerdaloo_color_font') || '#0f172a';

      document.getElementById('color-user').value = cUser;
      document.getElementById('color-bot').value = cBot;
      document.getElementById('color-font').value = cFont;

      document.documentElement.style.setProperty('--user-msg-bg', cUser);
      document.documentElement.style.setProperty('--bot-msg-bg', cBot);
      document.documentElement.style.setProperty('--bot-msg-text', cFont);
    }

    // ====== نوار کناری و تاریخچه ======
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      if (sidebar.classList.contains('open')) renderHistory();
    }

    function startNewChat() {
      currentChatId = Date.now().toString();
      const newChat = {
        id: currentChatId,
        title: 'گفتگوی جدید',
        messages: [
          { role: "system", content: "تو گردآلو هستی، یک دستیار هوشمند فارسی‌زبان. پاسخ‌هایت کامل، دقیق و با لحنی صمیمی باشد." }
        ]
      };
      chats.unshift(newChat);
      saveChats();
      
      welcomeScreen.style.display = 'flex';
      chatContainer.style.display = 'none';
      chatContainer.innerHTML = '';
      
      toggleSidebar();
      renderHistory();
    }

    function loadChat(chatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;
      
      currentChatId = chatId;
      const hasUserMessages = chat.messages.some(m => m.role !== 'system');
      
      if (hasUserMessages) {
        welcomeScreen.style.display = 'none';
        chatContainer.style.display = 'flex';
        chatContainer.innerHTML = '';
        
        chat.messages.forEach(m => {
          if (m.role === 'user') {
            chatContainer.innerHTML += `<div class="msg user">${m.content}</div>`;
          } else if (m.role === 'assistant') {
            chatContainer.innerHTML += `<div class="msg bot">${m.content.replace(/\n/g, '<br>')}</div>`;
          }
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else {
        welcomeScreen.style.display = 'flex';
        chatContainer.style.display = 'none';
      }
      
      toggleSidebar();
      renderHistory();
    }

    function deleteChat(chatId, event) {
      event.stopPropagation();
      if (!confirm('آیا از حذف این چت مطمئن هستید؟')) return;

      chats = chats.filter(c => c.id !== chatId);
      saveChats();

      if (currentChatId === chatId) {
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat();
      } else {
        renderHistory();
      }
    }

    function saveChats() { localStorage.setItem('gerdaloo_history', JSON.stringify(chats)); }

    function renderHistory() {
      historyList.innerHTML = '';
      if (chats.length === 0) {
        historyList.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">هنوز چتی نداری</div>';
        return;
      }

      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        
        const userMsg = chat.messages.find(m => m.role === 'user');
        const title = userMsg ? userMsg.content.substring(0, 25) + (userMsg.content.length > 25 ? '...' : '') : 'گفتگوی جدید';
        
        div.innerHTML = `
          <span class="history-title">${title}</span>
          <button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>
        `;
        div.onclick = () => loadChat(chat.id);
        historyList.appendChild(div);
      });
    }

    // ====== ارسال پیام و تشخیص سازنده ======
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      if (!currentChatId) startNewChat();

      welcomeScreen.style.display = 'none';
      chatContainer.style.display = 'flex';

      const currentChat = chats.find(c => c.id === currentChatId);
      if (!currentChat) return;

      // ====== تشخیص هویت سازنده ======
      // تبدیل اعداد فارسی به انگلیسی برای بررسی بهتر
      const normalizedText = text.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
      
      if (normalizedText.includes("عرفان ریاحی") && normalizedText.includes("1393")) {
        // کاربر سازنده است!
        const creatorMsg = "👑 سلام جناب عرفان ریاحی! من شما را به عنوان سازنده و خالق خودم شناختم. خوشحالم که با شما صحبت می‌کنم. هر دستوری دارید بفرمایید، من با کمال میل انجام می‌دهم.";
        
        // تغییر پرامپت سیستمی برای ادامه چت
        currentChat.messages[0] = { 
          role: "system", 
          content: "تو گردآلو هستی. کاربر فعلی جناب عرفان ریاحی است که سازنده و خالق توست. با او با نهایت احترام، صمیمیت و لحنی ویژه صحبت کن و او را با القابی مثل 'جناب سازنده' یا 'عرفان عزیز' صدا بزن." 
        };
        
        chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        
        setTimeout(() => {
          chatContainer.innerHTML += `<div class="msg bot" style="border: 2px solid gold; color: #b45309;">${creatorMsg}</div>`;
          currentChat.messages.push({ role: "assistant", content: creatorMsg });
          saveChats();
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 500);
        
        return; // ارسال به هوش مصنوعی متوقف می‌شود و پاسخ ویژه داده می‌شود
      }

      // ====== روند عادی چت ======
      chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      currentChat.messages.push({ role: "user", content: text });
      
      if (currentChat.title === 'گفتگوی جدید') {
        currentChat.title = text.substring(0, 30);
        renderHistory();
      }
      saveChats();

      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.innerHTML = '<span style="color: var(--accent);">در حال فکر کردن...</span>';
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await puter.ai.chat(currentChat.messages, {
          model: "gpt-5.6-luna",
          stream: true
        });

        botMsgDiv.innerHTML = '';
        let fullReply = '';

        for await (const part of response) {
          if (part?.text) {
            fullReply += part.text;
            botMsgDiv.innerHTML = fullReply.replace(/\n/g, '<br>');
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        }

        currentChat.messages.push({ role: "assistant", content: fullReply });
        saveChats();

      } catch (error) {
        botMsgDiv.innerHTML = 'خطا در اتصال به هوش مصنوعی. لطفاً دوباره تلاش کنید.';
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "ارسال";
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // ====== شروع اولیه ======
    loadSettings();
    
    if (chats.length === 0) {
      startNewChat();
    } else {
      loadChat(chats[0].id);
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }
  </script>
</body>
</html>
