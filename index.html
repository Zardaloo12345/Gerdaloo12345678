<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>گردآلو | نسخه نهایی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-header: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-input: #1e293b;
      --bg-input-field: #334155;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #f59e0b;
      
      --user-msg-bg: #1e40af;
      --bot-msg-bg: #ffffff;
      --bot-msg-text: #0f172a;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-header: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-input: #ffffff;
      --bg-input-field: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    /* جلوگیری از اسکرول کل صفحه */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    html, body { 
      height: 100vh; 
      width: 100vw; 
      overflow: hidden; 
      background: var(--bg-main); 
      color: var(--text-main); 
      transition: background 0.3s, color 0.3s;
    }

    /* ===== نوار کناری ===== */
    #sidebar {
      width: 280px; background: var(--bg-sidebar); height: 100vh;
      position: fixed; top: 0; right: 0; z-index: 1000;
      transform: translateX(100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column; border-left: 1px solid var(--border-color);
    }
    #sidebar.open { transform: translateX(0); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    #overlay.open { display: block; }

    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; color: var(--accent); }
    .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .new-chat-btn { margin: 15px; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .new-chat-btn:hover { background: #d97706; }

    .history-list { flex: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
    
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; margin-bottom: 8px; background: var(--bg-main);
      border-radius: 8px; font-size: 13px; color: var(--text-muted);
      cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .history-item:hover { background: var(--border-color); }
    .history-item.active { border-color: var(--accent); background: var(--border-color); color: var(--text-main); }
    .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
    
    .delete-chat-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; display: none; padding: 2px 5px; border-radius: 4px; }
    .delete-chat-btn:hover { background: rgba(239, 68, 68, 0.2); }
    .history-item:hover .delete-chat-btn { display: block; }

    /* ===== بخش اصلی ===== */
    .main-content { 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      width: 100%; 
      position: relative; 
    }
    
    header {
      padding: 15px; background: var(--bg-header); color: var(--accent); font-weight: bold; font-size: 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .menu-btn, .settings-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }

    #welcome-screen {
      flex: 1; display: flex; justify-content: center; align-items: center;
      text-align: center; padding: 20px;
    }
    #welcome-screen h1 { font-size: 32px; font-weight: bold; color: var(--text-main); }

    /* محیط چت */
    #chat { 
      flex: 1; 
      overflow-y: auto; 
      padding: 15px; 
      display: none; 
      flex-direction: column; 
      gap: 15px; 
      padding-bottom: 20px;
    }
    
    .msg { 
      padding: 12px 16px; border-radius: 12px; max-width: 85%; 
      font-size: 14px; line-height: 1.8; word-break: break-word; 
      text-align: right;
    }
    
    .bot { background: var(--bot-msg-bg); color: var(--bot-msg-text); align-self: flex-start; border-top-left-radius: 2px; border: 1px solid var(--border-color); }
    .user { background: var(--user-msg-bg); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }

    /* استایل Markdown */
    .bot p { margin-bottom: 10px; }
    .bot p:last-child { margin-bottom: 0; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 15px; margin-bottom: 8px; color: #000; line-height: 1.4; font-weight: bold; }
    .bot h1 { font-size: 18px; }
    .bot h2 { font-size: 16px; }
    .bot h3 { font-size: 15px; }
    .bot ul, .bot ol { margin-right: 25px; margin-bottom: 12px; padding-right: 5px; }
    .bot li { margin-bottom: 6px; }
    .bot strong { color: #000; font-weight: 900; }
    .bot code { background: #e2e8f0; color: #b91c1c; padding: 2px 6px; border-radius: 4px; font-family: monospace; direction: ltr; display: inline-block; }
    .bot pre { background: #1e293b; color: #fff; padding: 12px; border-radius: 8px; direction: ltr; text-align: left; overflow-x: auto; margin-bottom: 10px; }
    .bot pre code { background: none; color: inherit; padding: 0; }

    .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

    /* ===== نوار ورودی ===== */
    .input-wrapper {
      padding: 10px 15px 40px 15px;
      background: var(--bg-main);
      flex-shrink: 0;
      width: 100%;
    }

    .input-box { 
      background: var(--bg-input); 
      display: flex; 
      gap: 8px; /* فاصله بین دکمه‌ها */
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
      align-items: center;
      padding: 8px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    
    .icon-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; cursor: pointer; padding: 5px;
      transition: 0.2s; display: flex; align-items: center;
    }
    .icon-btn:hover { color: var(--accent); }
    .icon-btn.active { color: var(--accent); }
    
    input { 
      flex: 1; 
      padding: 12px 8px; 
      border-radius: 8px; 
      border: none; 
      outline: none; 
      background: transparent; 
      color: var(--text-main); 
      font-size: 14px; 
    }
    
    /* دکمه ارسال کاملاً مشخص و بزرگ */
    button#send { 
      padding: 10px 25px; 
      border-radius: 8px; 
      border: none; 
      background: var(--accent); 
      color: #000; 
      font-weight: bold; 
      font-size: 15px; 
      cursor: pointer; 
      flex-shrink: 0;
    }
    button#send:hover { background: #d97706; }
    button#send:disabled { background: #64748b; cursor: not-allowed; }

    /* ===== تنظیمات ===== */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--bg-header); padding: 25px; border-radius: 16px; width: 100%; max-width: 350px; border: 1px solid var(--border-color); }
    .modal-content h3 { color: var(--accent); margin-bottom: 20px; text-align: center; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .setting-row:last-child { border-bottom: none; margin-bottom: 20px; }
    .setting-row input[type="color"] { width: 40px; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: none; }
    .setting-row button { background: var(--bg-input-field); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .btn-close-settings { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; }

    /* نشانگرها */
    .mode-indicator {
      display: none; background: var(--accent); color: #000;
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-weight: bold;
    }
    .mode-indicator.show { display: block; }
  </style>
</head>
<body>

  <div id="overlay" onclick="toggleSidebar()"></div>
  <div class="mode-indicator" id="mode-indicator">حالت فعال است</div>

  <!-- نوار کناری -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>تاریخچه چت‌ها</h2>
      <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ چت جدید</button>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- بخش اصلی -->
  <div class="main-content">
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span>گردآلو</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>
    
    <div id="welcome-screen">
      <h1>چطور می‌تونم کمکتون کنم؟</h1>
    </div>

    <div id="chat"></div>

    <!-- نوار ورودی با دکمه ارسال کاملاً مشخص -->
    <div class="input-wrapper">
      <div class="input-box">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="پیوست عکس">📎</button>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        
        <button class="icon-btn" onclick="document.getElementById('doc-input').click()" title="پیوست فایل">📄</button>
        <input type="file" id="doc-input" accept=".pdf,.txt" style="display: none;" onchange="handleDocUpload(event)">
        
        <button class="icon-btn" id="gen-img-btn" onclick="toggleImageMode()" title="تولید عکس">🎨</button>
        <button class="icon-btn" id="web-btn" onclick="toggleWebMode()" title="جستجوی وب">🌐</button>
        
        <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
        
        <!-- دکمه ارسال -->
        <button id="send" onclick="sendMessage()">ارسال</button>
      </div>
    </div>
  </div>

  <!-- تنظیمات -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>تنظیمات ظاهری</h3>
      <div class="setting-row">
        <span>حالت تاریک/روشن</span>
        <button onclick="toggleTheme()">تغییر</button>
      </div>
      <div class="setting-row">
        <span>رنگ پیام‌های شما</span>
        <input type="color" id="color-user" oninput="applyCustomColors()">
      </div>
      <div class="setting-row">
        <span>رنگ پیام‌های گردآلو</span>
        <input type="color" id="color-bot" oninput="applyCustomColors()">
      </div>
      <div class="setting-row">
        <span>رنگ متن گردآلو</span>
        <input type="color" id="color-font" oninput="applyCustomColors()">
      </div>
      <button class="btn-close-settings" onclick="closeSettings()">بستن</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat');
    const welcomeScreen = document.getElementById('welcome-screen');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    const historyList = document.getElementById('history-list');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const modeIndicator = document.getElementById('mode-indicator');

    let chats = JSON.parse(localStorage.getItem('gerdaloo_history')) || [];
    let currentChatId = null;
    let currentImageData = null;
    let currentDocPath = null;
    let isImageMode = false;
    let isWebMode = false;

    // تنظیمات
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('gerdaloo_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    function applyCustomColors() {
      const cUser = document.getElementById('color-user').value;
      const cBot = document.getElementById('color-bot').value;
      const cFont = document.getElementById('color-font').value;
      document.documentElement.style.setProperty('--user-msg-bg', cUser);
      document.documentElement.style.setProperty('--bot-msg-bg', cBot);
      document.documentElement.style.setProperty('--bot-msg-text', cFont);
      localStorage.setItem('gerdaloo_color_user', cUser);
      localStorage.setItem('gerdaloo_color_bot', cBot);
      localStorage.setItem('gerdaloo_color_font', cFont);
    }
    function loadSettings() {
      if (localStorage.getItem('gerdaloo_theme') === 'light') document.body.classList.add('light-mode');
      const cUser = localStorage.getItem('gerdaloo_color_user') || '#1e40af';
      const cBot = localStorage.getItem('gerdaloo_color_bot') || '#ffffff';
      const cFont = localStorage.getItem('gerdaloo_color_font') || '#0f172a';
      document.getElementById('color-user').value = cUser;
      document.getElementById('color-bot').value = cBot;
      document.getElementById('color-font').value = cFont;
      document.documentElement.style.setProperty('--user-msg-bg', cUser);
      document.documentElement.style.setProperty('--bot-msg-bg', cBot);
      document.documentElement.style.setProperty('--bot-msg-text', cFont);
    }

    // نوار کناری
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      if (sidebar.classList.contains('open')) renderHistory();
    }
    function startNewChat() {
      currentChatId = Date.now().toString();
      const newChat = {
        id: currentChatId,
        title: 'گفتگوی جدید',
        messages: [{ role: "system", content: "تو گردآلو هستی، یک دستیار هوشمند فارسی‌زبان. پاسخ‌هایت کامل، دقیق و با لحنی صمیمی باشد. از Markdown استفاده کن." }]
      };
      chats.unshift(newChat);
      saveChats();
      welcomeScreen.style.display = 'flex';
      chatContainer.style.display = 'none';
      chatContainer.innerHTML = '';
      toggleSidebar();
    }
    function loadChat(chatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;
      currentChatId = chatId;
      const hasUserMessages = chat.messages.some(m => m.role !== 'system');
      if (hasUserMessages) {
        welcomeScreen.style.display = 'none';
        chatContainer.style.display = 'flex';
        chatContainer.innerHTML = '';
        chat.messages.forEach(m => {
          if (m.role === 'user') {
            let content = m.content;
            if (m.image) content += `<br><img src="${m.image}">`;
            chatContainer.innerHTML += `<div class="msg user">${content}</div>`;
          } else if (m.role === 'assistant') {
            let content = marked.parse(m.content); 
            if (m.generatedImage) content += `<br><img src="${m.generatedImage}">`;
            chatContainer.innerHTML += `<div class="msg bot">${content}</div>`;
          }
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else {
        welcomeScreen.style.display = 'flex';
        chatContainer.style.display = 'none';
      }
      toggleSidebar();
    }
    function deleteChat(chatId, event) {
      event.stopPropagation();
      if (!confirm('آیا از حذف این چت مطمئن هستید؟')) return;
      chats = chats.filter(c => c.id !== chatId);
      saveChats();
      if (currentChatId === chatId) {
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat();
      } else {
        renderHistory();
      }
    }
    function saveChats() { localStorage.setItem('gerdaloo_history', JSON.stringify(chats)); }
    function renderHistory() {
      historyList.innerHTML = '';
      if (chats.length === 0) {
        historyList.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">هنوز چتی نداری</div>';
        return;
      }
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        const userMsg = chat.messages.find(m => m.role === 'user');
        const title = userMsg ? userMsg.content.substring(0, 25) + (userMsg.content.length > 25 ? '...' : '') : 'گفتگوی جدید';
        div.innerHTML = `<span class="history-title">${title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
        div.onclick = () => loadChat(chat.id);
        historyList.appendChild(div);
      });
    }

    // آپلودها
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageData = e.target.result;
        input.placeholder = "عکس انتخاب شد. سوال خود را بپرسید...";
        input.focus();
      };
      reader.readAsDataURL(file);
    }
    async function handleDocUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        input.placeholder = "در حال آپلود فایل...";
        const puterFile = await puter.fs.write(file.name, file);
        currentDocPath = puterFile.path;
        input.placeholder = "فایل آپلود شد. حالا بگو باهاش چیکار کنم...";
        input.focus();
      } catch (error) {
        alert("خطا در آپلود فایل.");
      }
    }

    // حالت‌ها
    function toggleImageMode() {
      isImageMode = !isImageMode;
      if (isImageMode) {
        if (isWebMode) toggleWebMode();
        document.getElementById('gen-img-btn').classList.add('active');
        modeIndicator.classList.add('show');
        modeIndicator.textContent = "🎨 حالت تولید عکس فعال است";
        input.placeholder = "توصیف عکس مورد نظرت رو بنویس...";
      } else {
        document.getElementById('gen-img-btn').classList.remove('active');
        modeIndicator.classList.remove('show');
        input.placeholder = "پیامت رو اینجا بنویس...";
      }
    }
    function toggleWebMode() {
      isWebMode = !isWebMode;
      if (isWebMode) {
        if (isImageMode) toggleImageMode();
        document.getElementById('web-btn').classList.add('active');
        modeIndicator.classList.add('show');
        modeIndicator.textContent = "🌐 حالت جستجوی وب فعال است";
        input.placeholder = "سوال خود را برای جستجو بپرسید...";
      } else {
        document.getElementById('web-btn').classList.remove('active');
        modeIndicator.classList.remove('show');
        input.placeholder = "پیامت رو اینجا بنویس...";
      }
    }

    // ارسال پیام
    async function sendMessage() {
      const text = input.value.trim();
      if (!text && !currentImageData && !currentDocPath) return;

      if (!currentChatId) startNewChat();
      welcomeScreen.style.display = 'none';
      chatContainer.style.display = 'flex';

      const currentChat = chats.find(c => c.id === currentChatId);
      if (!currentChat) return;

      // تولید عکس
      if (isImageMode && text) {
        chatContainer.innerHTML += `<div class="msg user">🎨 تولید عکس: ${text}</div>`;
        input.value = '';
        currentChat.messages.push({ role: "user", content: `تولید عکس: ${text}` });
        saveChats();
        
        sendBtn.disabled = true;
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'msg bot';
        botMsgDiv.innerHTML = '<span style="color: var(--accent);">🎨 در حال ساخت تصویر...</span>';
        chatContainer.appendChild(botMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const result = await puter.ai.chat(text, { model: "gemini-3.1-flash-image-preview" });
          botMsgDiv.innerHTML = marked.parse(result.message.content) + "<br>";
          if (result.message.images?.length > 0) {
            const imgUrl = result.message.images[0].image_url.url;
            botMsgDiv.innerHTML += `<img src="${imgUrl}">`;
            currentChat.messages.push({ role: "assistant", content: result.message.content, generatedImage: imgUrl });
          } else {
            currentChat.messages.push({ role: "assistant", content: result.message.content });
          }
          saveChats();
        } catch (error) {
          botMsgDiv.innerHTML = 'خطا در تولید عکس.';
        } finally {
          sendBtn.disabled = false;
          toggleImageMode();
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        return;
      }

      // تحلیل فایل
      if (currentDocPath) {
        chatContainer.innerHTML += `<div class="msg user">📄 فایل: ${text || 'خلاصه کن'}</div>`;
        input.value = '';
        
        sendBtn.disabled = true;
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'msg bot';
        botMsgDiv.innerHTML = '<span style="color: var(--accent);">📄 در حال خواندن فایل...</span>';
        chatContainer.appendChild(botMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const response = await puter.ai.chat([{ role: "user", content: [{ type: "file", puter_path: currentDocPath }, { type: "text", text: text || "این سند را برای من خلاصه کن." }] }], { model: "claude-sonnet-5", stream: true });
          botMsgDiv.innerHTML = '';
          let fullReply = '';
          for await (const part of response) {
            if (part?.text) {
              fullReply += part.text;
              botMsgDiv.innerHTML = marked.parse(fullReply); 
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
          currentChat.messages.push({ role: "assistant", content: fullReply });
          saveChats();
        } catch (error) {
          botMsgDiv.innerHTML = 'خطا در خواندن فایل.';
        } finally {
          sendBtn.disabled = false;
          currentDocPath = null;
          document.getElementById('doc-input').value = '';
          input.placeholder = "پیامت رو اینجا بنویس...";
        }
        return;
      }

      // جستجوی وب
      if (isWebMode) {
        chatContainer.innerHTML += `<div class="msg user">🌐 جستجو: ${text}</div>`;
        input.value = '';
        
        sendBtn.disabled = true;
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'msg bot';
        botMsgDiv.innerHTML = '<span style="color: #3b82f6;">🌐 در حال جستجو در اینترنت...</span>';
        chatContainer.appendChild(botMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const response = await puter.ai.chat(text, { model: "openai/gpt-5.6-luna", tools: [{ type: "web_search" }], stream: true });
          botMsgDiv.innerHTML = '';
          let fullReply = '';
          for await (const part of response) {
            if (part?.text) {
              fullReply += part.text;
              botMsgDiv.innerHTML = marked.parse(fullReply);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
          currentChat.messages.push({ role: "assistant", content: fullReply });
          saveChats();
        } catch (error) {
          botMsgDiv.innerHTML = 'خطا در جستجو.';
        } finally {
          sendBtn.disabled = false;
          toggleWebMode();
        }
        return;
      }

      // تحلیل عکس
      if (currentImageData) {
        let userMsgHTML = text || "این عکس را توصیف کن.";
        userMsgHTML += `<br><img src="${currentImageData}">`;
        chatContainer.innerHTML += `<div class="msg user">${userMsgHTML}</div>`;
        input.value = '';
        
        sendBtn.disabled = true;
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'msg bot';
        botMsgDiv.innerHTML = '<span style="color: var(--accent);">در حال تحلیل عکس...</span>';
        chatContainer.appendChild(botMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const response = await puter.ai.chat(text || "این عکس را توصیف کن.", currentImageData, { model: "claude-sonnet-5", stream: true });
          botMsgDiv.innerHTML = '';
          let fullReply = '';
          for await (const part of response) {
            if (part?.text) {
              fullReply += part.text;
              botMsgDiv.innerHTML = marked.parse(fullReply);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
          currentChat.messages.push({ role: "assistant", content: fullReply });
          saveChats();
        } catch (error) {
          botMsgDiv.innerHTML = 'خطا در تحلیل عکس.';
        } finally {
          sendBtn.disabled = false;
          currentImageData = null;
          document.getElementById('file-input').value = '';
          input.placeholder = "پیامت رو اینجا بنویس...";
        }
        return;
      }

      // چت متنی عادی
      chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      currentChat.messages.push({ role: "user", content: text });
      
      if (currentChat.title === 'گفتگوی جدید') {
        currentChat.title = text.substring(0, 30);
        renderHistory();
      }
      saveChats();

      sendBtn.disabled = true;
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.innerHTML = '<span style="color: var(--accent);">در حال فکر کردن...</span>';
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await puter.ai.chat(currentChat.messages, { model: "claude-sonnet-5", stream: true });
        botMsgDiv.innerHTML = '';
        let fullReply = '';
        for await (const part of response) {
          if (part?.text) {
            fullReply += part.text;
            botMsgDiv.innerHTML = marked.parse(fullReply); 
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        }
        currentChat.messages.push({ role: "assistant", content: fullReply });
        saveChats();
      } catch (error) {
        botMsgDiv.innerHTML = 'خطا در اتصال به هوش مصنوعی.';
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // شروع
    loadSettings();
    if (chats.length === 0) startNewChat();
    else loadChat(chats[0].id);
  </script>
</body>
</html>
