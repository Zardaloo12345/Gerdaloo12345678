<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو | Gerdaloo AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- ===== سایدبار ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🍑</div>
          <span class="brand-name">گردآلو</span>
        </div>
        <button class="sidebar-close" id="sidebarClose">✕</button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>گفتگوی جدید</span>
      </button>

      <div class="sidebar-section">
        <div class="sidebar-label">گفتگوهای اخیر</div>
        <div class="chat-history" id="chatHistory">
          <div class="history-empty">هنوز گفتگویی نداری</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="memory-info">
          <span class="memory-dot"></span>
          <span>حافظه: <b id="memoryCount">0</b> مورد</span>
        </div>
        <div class="user-info">
          <div class="user-avatar">Z</div>
          <div class="user-details">
            <div class="user-name">zardaloo12345</div>
            <div class="user-plan">نسخه رایگان</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===== بخش اصلی ===== -->
    <main class="main">
      <!-- هدر -->
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="model-selector">
          <span class="model-name">گردآلو</span>
          <span class="model-badge">v2.0</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="voiceToggle" title="پاسخ صوتی">🔊</button>
          <button class="icon-btn" id="themeToggle" title="حالت تاریک">🌙</button>
        </div>
      </header>

      <!-- ناحیه چت -->
      <div class="chat-area" id="chatArea">
        <div class="messages" id="chatMessages">
          <!-- پیام خوش‌آمد -->
          <div class="welcome">
            <div class="welcome-icon">🍑</div>
            <h1>چطور می‌تونم کمکت کنم؟</h1>
            <p>دستیار هوشمند سایت زردآلو</p>
          </div>
        </div>
      </div>

      <!-- ناحیه ورودی -->
      <div class="composer-wrap">
        <div class="composer">
          <button class="composer-btn" id="micBtn" title="ضبط صدا">🎤</button>
          <textarea
            id="userInput"
            class="composer-input"
            placeholder="پیام خود را بنویسید..."
            rows="1"
          ></textarea>
          <button class="composer-send" id="sendBtn" title="ارسال">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
        <div class="composer-footer">
          گردآلو ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
