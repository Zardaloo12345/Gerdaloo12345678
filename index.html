<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پرانتز | هوش مصنوعی درون‌مرورگری</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- بارگذاری WebLLM از CDN -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    window.webllm = webllm;
  </script>
  
  <style>
    /* استایل‌ها دقیقاً مثل قبل (برای صرفه‌جویی در فضا حذف شده‌اند، همان استایل‌های قبلی را اینجا بگذار) */
    :root { --bg-main: #0f172a; --bg-header: #1e293b; --bg-input: #1e293b; --text-main: #ffffff; --text-muted: #94a3b8; --border-color: #334155; --accent: #f59e0b; --user-msg-bg: #1e40af; --bot-msg-bg: #ffffff; --bot-msg-text: #0f172a; }
    body.light-mode { --bg-main: #f1f5f9; --bg-header: #ffffff; --bg-input: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
    #login-screen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: var(--bg-main); z-index: 9999; }
    .login-box { background: var(--bg-header); padding: 40px; border-radius: 24px; text-align: center; }
    .auth-btn { padding: 14px 30px; border-radius: 12px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; margin-top: 20px; }
    #app-container { display: none; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 15px; background: var(--bg-header); display: flex; justify-content: space-between; align-items: center; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; }
    .bot { background: var(--bot-msg-bg); color: var(--bot-msg-text); align-self: flex-start; }
    .user { background: var(--user-msg-bg); color: #fff; align-self: flex-end; }
    .input-box { padding: 10px; background: var(--bg-input); display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: var(--bg-header); color: var(--text-main); outline: none; }
    button#send { padding: 12px 24px; border-radius: 8px; border: none; background: var(--accent); font-weight: bold; cursor: pointer; }
    .status { font-size: 12px; color: var(--text-muted); text-align: center; padding: 5px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1>پرانتز</h1>
      <p>هوش مصنوعی کاملاً محلی (بدون اینترنت و کلید API)</p>
      <button class="auth-btn" onclick="startApp()">شروع (دانلود مدل)</button>
      <p id="load-status" class="status" style="margin-top:10px;">در حال آماده‌سازی...</p>
    </div>
  </div>

  <div id="app-container">
    <header>
      <span>پرانتز (محلی)</span>
      <span id="engine-status" style="font-size:12px; color:#22c55e;">آماده</span>
    </header>
    <div id="chat">
      <div class="msg bot">سلام! من یک هوش مصنوعی هستم که کاملاً روی گوشی/کامپیوتر خودت اجرا می‌شوم. هیچ داده‌ای به اینترنت فرستاده نمی‌شود. چطور می‌توانم کمکت کنم؟</div>
    </div>
    <div class="input-box">
      <input id="i" placeholder="پیامت رو بنویس..." autocomplete="off">
      <button id="send" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script>
    let engine = null;
    const chatContainer = document.getElementById('chat');
    const input = document.getElementById('i');

    // تابع شروع و بارگذاری مدل
    async function startApp() {
      const statusEl = document.getElementById('load-status');
      const loginBtn = document.querySelector('.auth-btn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'در حال دانلود مدل...';

      try {
        // انتخاب یک مدل سبک (Llama 3.2 1B) برای اجرا روی دستگاه
        const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
        
        statusEl.textContent = "در حال دانلود و راه‌اندازی مدل (ممکن است چند دقیقه طول بکشد)...";
        
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (progress) => {
            statusEl.textContent = `در حال دانلود: ${Math.round(progress.progress * 100)}%`;
          }
        });

        // بعد از بارگذاری موفق، وارد برنامه شو
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        
      } catch (error) {
        console.error(error);
        statusEl.textContent = "خطا در بارگذاری مدل. مرورگر شما ممکن است از WebGPU پشتیبانی نکند یا کارت گرافیک کافی نداشته باشد.";
        loginBtn.disabled = false;
        loginBtn.textContent = 'تلاش دوباره';
      }
    }

    // ارسال پیام
    async function sendMessage() {
      const text = input.value.trim();
      if (!text || !engine) return;

      // نمایش پیام کاربر
      chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // نمایش وضعیت تایپ
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.textContent = 'در حال فکر کردن...';
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // ارسال درخواست به موتور محلی
        const completion = await engine.chat.completions.create({
          messages: [
            { role: "system", content: "تو پرانتز هستی، یک دستیار هوشمند فارسی‌زبان. پاسخ‌هایت کامل و مفید باشد." },
            { role: "user", content: text }
          ],
          stream: true, // استریم برای نمایش کلمه به کلمه
        });

        botMsgDiv.textContent = '';
        let fullReply = '';

        for await (const chunk of completion) {
          const content = chunk.choices[0]?.delta?.content || '';
          fullReply += content;
          botMsgDiv.innerHTML = marked.parse(fullReply);
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

      } catch (error) {
        botMsgDiv.textContent = 'خطا در پردازش محلی.';
        console.error(error);
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
