<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پرانتز | انتخاب دستگاه</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0f172a; --bg-header: #1e293b; --bg-input: #1e293b;
      --text-main: #ffffff; --text-muted: #94a3b8; --border-color: #334155;
      --accent: #f59e0b; --user-msg-bg: #1e40af; --bot-msg-bg: #ffffff; --bot-msg-text: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; background: var(--bg-main); color: var(--text-main); }

    /* صفحه انتخاب دستگاه */
    #device-screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-main); z-index: 10000; padding: 20px; text-align: center; }
    .device-box h1 { color: var(--accent); font-size: 32px; margin-bottom: 10px; }
    .device-box p { color: var(--text-muted); margin-bottom: 40px; }
    .device-buttons { display: flex; gap: 20px; justify-content: center; }
    .device-btn { background: var(--bg-header); border: 2px solid var(--border-color); border-radius: 24px; padding: 40px 30px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .device-btn:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.2); }
    .device-icon { font-size: 60px; }
    .device-btn span { font-size: 18px; font-weight: bold; color: var(--text-main); }

    /* صفحه ورود Puter (فقط برای گوشی) */
    #login-screen { display: none; position: fixed; inset: 0; justify-content: center; align-items: center; z-index: 9999; padding: 20px; background: var(--bg-main); }
    .login-box { background: var(--bg-header); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); text-align: center; }
    .login-box h1 { color: var(--accent); font-size: 32px; margin-bottom: 10px; }
    .auth-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 15px; font-weight: bold; cursor: pointer; }

    /* محیط چت */
    #app-container { display: none; flex-direction: column; height: 100vh; width: 100vw; }
    header { padding: 15px; background: var(--bg-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .brand-name { color: var(--accent); font-size: 18px; font-weight: bold; }
    #sidebar { width: 280px; background: var(--bg-header); height: 100vh; position: fixed; top: 0; right: 0; z-index: 1000; transform: translateX(100%); transition: transform 0.3s; display: flex; flex-direction: column; border-left: 1px solid var(--border-color); }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .new-chat-btn { margin: 15px; padding: 12px; background: var(--accent); color: #000; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
    .history-item { padding: 12px; margin-bottom: 8px; background: var(--bg-main); border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; }
    .main-content { display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 15px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; }
    .bot { background: var(--bot-msg-bg); color: var(--bot-msg-text); align-self: flex-start; }
    .user { background: var(--user-msg-bg); color: #fff; align-self: flex-end; }
    .input-wrapper { padding: 10px 15px 20px 15px; }
    .input-box { background: var(--bg-input); display: flex; gap: 8px; border-radius: 12px; border: 1px solid var(--border-color); padding: 6px; }
    input { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-main); outline: none; }
    #send { padding: 10px 24px; background: var(--accent); border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- ۱. صفحه انتخاب دستگاه -->
  <div id="device-screen">
    <div class="device-box">
      <h1>پرانتز</h1>
      <p>لطفاً دستگاه خود را انتخاب کنید</p>
      <div class="device-buttons">
        <div class="device-btn" onclick="selectDevice('desktop')">
          <span class="device-icon">💻</span>
          <span>کامپیوتر</span>
        </div>
        <div class="device-btn" onclick="selectDevice('mobile')">
          <span class="device-icon">📱</span>
          <span>گوشی</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ۲. صفحه ورود (فقط برای گوشی) -->
  <div id="login-screen">
    <div class="login-box">
      <h1>پرانتز</h1>
      <p id="login-device-text" style="color: var(--text-muted); margin-bottom: 20px;"></p>
      <button class="auth-btn" onclick="login()">ورود با حساب Puter</button>
    </div>
  </div>

  <!-- ۳. محیط چت -->
  <div id="app-container">
    <div id="overlay" onclick="toggleSidebar()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999;"></div>
    <div id="sidebar">
      <div class="sidebar-header"><h2>تاریخچه</h2><button class="close-sidebar" onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:20px;">✕</button></div>
      <button class="new-chat-btn" onclick="startNewChat()">+ چت جدید</button>
      <div class="history-list" id="history-list"></div>
    </div>
    <div class="main-content">
      <header>
        <div style="display:flex; align-items:center; gap:15px;">
          <button class="icon-btn" onclick="toggleSidebar()" style="color:white;">☰</button>
          <div class="brand-name">پرانتز</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="icon-btn" onclick="logout()">🚪</button>
        </div>
      </header>
      <div id="welcome-screen" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <h1 style="font-size:24px; margin-bottom:10px;">سلام...<br>من پرانتز هستم.</h1>
      </div>
      <div id="chat"></div>
      <div class="input-wrapper">
        <div class="input-box">
          <button class="icon-btn" id="mic-btn" onclick="toggleRecording()">🎤</button>
          <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
          <button id="send" onclick="sendMessage()">ارسال</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // تنظیمات AvalAI (برای حالت کامپیوتر)
    // ==========================================
    const AVALAI_API_KEY = "aa-BQ297TbDAQHYeq8sPzTbwII1v4SyAQkSKHzCjuhlZ5fH7iiy"; 
    const AVALAI_URL = "https://api.avalai.ir/v1/chat/completions";

    // ====== متغیرهای اصلی ======
    let currentDeviceMode = 'mobile';
    const chatContainer = document.getElementById('chat');
    const welcomeScreen = document.getElementById('welcome-screen');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    const historyList = document.getElementById('history-list');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    let chats = JSON.parse(localStorage.getItem('gerdaloo_history')) || [];
    let currentChatId = null;
    let recognition = null;
    let isRecording = false;

    // ====== انتخاب دستگاه ======
    function selectDevice(mode) {
      currentDeviceMode = mode;
      localStorage.setItem('gerdaloo_device_mode', mode);

      if (window.electronAPI) {
        window.electronAPI.setMode(mode);
      }

      document.getElementById('device-screen').style.display = 'none';

      if (mode === 'desktop') {
        // حالت کامپیوتر: مستقیم برو به چت (بدون لاگین Puter)
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        initApp();
        addSystemMessage("✅ اتصال به AvalAI برقرار است. آماده پاسخگویی هستم.");
      } else {
        // حالت گوشی: برو به صفحه لاگین Puter
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-device-text').textContent = 'حالت گوشی انتخاب شد';
      }
    }

    function addSystemMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg bot';
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.style.display = 'flex';
      welcomeScreen.style.display = 'none';
    }

    // ====== لاگین Puter (برای گوشی) ======
    async function login() {
      const btn = document.querySelector('.auth-btn');
      btn.innerHTML = 'در حال اتصال...';
      btn.disabled = true;
      try {
        const user = await puter.auth.signIn();
        localStorage.setItem('gerdaloo_logged_in', 'true');
        localStorage.setItem('gerdaloo_username', user.username || 'کاربر');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        initApp();
      } catch (error) {
        alert('ورود انجام نشد.');
        btn.innerHTML = 'ورود با حساب Puter';
        btn.disabled = false;
      }
    }

    async function logout() {
      if (!confirm('خارج می‌شوید؟')) return;
      try { await puter.auth.signOut(); } catch(e) {}
      localStorage.clear();
      location.reload();
    }

    function initApp() {
      if (chats.length === 0) startNewChat();
      else loadChat(chats[0].id);
    }

    // ====== مدیریت چت ======
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
      if (sidebar.classList.contains('open')) renderHistory();
    }

    function startNewChat() {
      currentChatId = Date.now().toString();
      chats.unshift({ id: currentChatId, title: 'گفتگوی جدید', messages: [] });
      localStorage.setItem('gerdaloo_history', JSON.stringify(chats));
      welcomeScreen.style.display = 'flex';
      chatContainer.style.display = 'none';
      chatContainer.innerHTML = '';
      toggleSidebar();
    }

    function loadChat(chatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;
      currentChatId = chatId;
      if (chat.messages.length > 0) {
        welcomeScreen.style.display = 'none';
        chatContainer.style.display = 'flex';
        chatContainer.innerHTML = '';
        chat.messages.forEach(m => {
          if (m.role === 'user') chatContainer.innerHTML += `<div class="msg user">${m.content}</div>`;
          else if (m.role === 'assistant') chatContainer.innerHTML += `<div class="msg bot">${marked.parse(m.content)}</div>`;
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else {
        welcomeScreen.style.display = 'flex';
        chatContainer.style.display = 'none';
      }
      toggleSidebar();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const userMsg = chat.messages.find(m => m.role === 'user');
        div.textContent = userMsg ? userMsg.content.substring(0, 20) : 'گفتگوی جدید';
        div.onclick = () => loadChat(chat.id);
        historyList.appendChild(div);
      });
    }

    function toggleRecording() {
      const micBtn = document.getElementById('mic-btn');
      if (isRecording) { if (recognition) recognition.stop(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('میکروفن پشتیبانی نمی‌شود.'); return; }
      recognition = new SR();
      recognition.lang = 'fa-IR';
      recognition.onstart = () => { isRecording = true; micBtn.style.color = '#ef4444'; };
      recognition.onresult = (event) => { input.value = event.results[0][0].transcript; sendMessage(); };
      recognition.onend = () => { isRecording = false; micBtn.style.color = ''; };
      recognition.start();
    }

    // ====== ارسال پیام ======
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      if (!currentChatId) startNewChat();
      welcomeScreen.style.display = 'none';
      chatContainer.style.display = 'flex';
      const currentChat = chats.find(c => c.id === currentChatId);
      
      chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      currentChat.messages.push({ role: 'user', content: text });
      
      sendBtn.disabled = true;
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.innerHTML = 'در حال پردازش...';
      chatContainer.appendChild(botMsgDiv);

      try {
        let fullReply = '';

        if (currentDeviceMode === 'desktop') {
          // ==========================================
          // حالت کامپیوتر: اتصال به AvalAI
          // ==========================================
          const response = await fetch(AVALAI_URL, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${AVALAI_API_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "gpt-5.4-mini", // مدل ارزان و سریع
              messages: currentChat.messages,
              stream: true
            })
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || `HTTP error! status: ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          botMsgDiv.innerHTML = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            for (const line of chunk.split('\n').filter(Boolean)) {
              if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                try {
                  const json = JSON.parse(line.slice(6));
                  if (json.choices?.[0]?.delta?.content) {
                    fullReply += json.choices[0].delta.content;
                    botMsgDiv.innerHTML = marked.parse(fullReply);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                  }
                } catch (e) {}
              }
            }
          }

        } else {
          // ==========================================
          // حالت گوشی: اتصال به Puter
          // ==========================================
          const response = await puter.ai.chat(currentChat.messages, { model: 'gpt-5.6-luna', stream: true });
          botMsgDiv.innerHTML = '';
          for await (const part of response) {
            if (part?.text) {
              fullReply += part.text;
              botMsgDiv.innerHTML = marked.parse(fullReply);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
        }

        currentChat.messages.push({ role: 'assistant', content: fullReply });
        localStorage.setItem('gerdaloo_history', JSON.stringify(chats));
      } catch (error) {
        botMsgDiv.innerHTML = `⚠️ خطا: ${error.message}`;
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
