<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو مینی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 15px; background: #1e293b; text-align: center; font-weight: bold; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.6; animation: fade 0.3s; white-space: pre-wrap; }
    .bot { background: #fff; color: #0f172a; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: linear-gradient(135deg, #1e40af, #38bdf8); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
    
    /* استایل نوار ورودی */
    .input-box { padding: 15px; background: #1e293b; display: flex; gap: 10px; flex-shrink: 0; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: #334155; color: #fff; font-size: 14px; }
    button { padding: 10px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button:hover { background: #d97706; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>🍑 گردآلو مینی</header>
  
  <div id="chat">
    <div class="msg bot">سلام! من گردآلو هستم. چطور می‌تونم کمکت کنم؟ (می‌تونی بگی: داستان، ایمیل، کپشن، شعر یا متن)</div>
  </div>

  <div class="input-box">
    <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
    <button id="btn">ارسال</button>
  </div>

  <script>
    const kb = {
      "سلام": "سلام! خوشحالم که باهام حرف میزنی 😊",
      "سازنده": "سازنده سایت زردآلو، عرفان ریاحی است 🧑🏻‍💻",
      "آدرس": "آدرس سایت: zardaloo12345.github.io/zardaloo.online.shop",
      "پروفایل": "برای استفاده از زردآلو، اول باید پروفایل خودت رو بسازی 👤",
      "کالا": "برای ثبت کالا، از بخش «ثبت کالای جدید» در منو استفاده کن 📦",
      "بازار": "بخش بازار زردآلو محل خرید و فروش کالاست 🛒",
      "خداحافظ": "خداحافظ! بازم بیا پیشم 👋",
      
      // === بخش نوشتن متن ===
      "داستان": "📖 **داستان کوتاه:**\nدر دل شب، ستاره‌ای کوچک تصمیم گرفت از آسمان جدا شود تا دنیای زیر پایش را ببیند. او به دریا رسید، به جنگل رفت و در نهایت فهمید که زیبایی واقعی در نورانی کردن آسمان برای دیگران است.",
      "ایمیل": "📧 **متن ایمیل:**\nموضوع: درخواست همکاری\n\nبا سلام و احترام،\nامیدوارم این پیام شما را در سلامت کامل بیابد. بنده به منظور بررسی فرصت‌های همکاری مشترک، درخواست یک جلسه حضوری یا آنلاین دارم. لطفاً در صورت تمایل، زمان مناسب خود را اعلام فرمایید.\n\nبا تشکر و احترام",
      "کپشن": "📱 **کپشن اینستاگرام:**\nزندگی مثل یک کتاب است؛ بعضی فصل‌ها را باید بارها خواند تا معنایش را بفهمی. صفحه جدید را با امید باز کن... ✨\n\n#زندگی #امید #انگیزه #کتاب_زندگی",
      "شعر": "📜 **شعر کوتاه:**\nدر این شب تار، در این دل خسته،\nبه دنبال نوری، میان هزار پنجره بسته.\nمگر می‌شود پرواز کرد بی بال،\nمگر می‌شود عاشق شد و ماند بی حال.",
      "متن": "📝 **متن انگیزشی:**\nهیچ‌وقت دیر نیست. هر روزی که از خواب بیدار می‌شوی، یک فرصت تازه است برای شروع دوباره. به خودت ایمان داشته باش و قدم اول را بردار؛ بقیه راه خودش باز می‌شود. 🚀"
    };

    const chat = document.getElementById('chat');
    const input = document.getElementById('i');
    const btn = document.getElementById('btn');

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // نمایش پیام کاربر
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';

      // پیدا کردن جواب
      let reply = "متأسفم، هنوز درباره این موضوع چیزی یاد نگرفته‌ام 🍑 (می‌تونی بگی: داستان، ایمیل، کپشن، شعر یا متن)";
      for (const key in kb) {
        if (text.includes(key)) {
          reply = kb[key];
          break;
        }
      }

      // نمایش جواب با تاخیر
      setTimeout(() => {
        chat.innerHTML += `<div class="msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 400);

      chat.scrollTop = chat.scrollHeight;
    }

    // ارسال با کلیک روی دکمه
    btn.onclick = sendMessage;

    // ارسال با زدن Enter
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
