    // تبدیل آرایه به آبجکت برای جستجوی سریع‌تر
    const kbObj = {};
    kb.forEach(item => kbObj[item[0]] = item[1]);

    const chat = document.getElementById('chat');
    const input = document.getElementById('i');
    const btn = document.getElementById('btn');

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';

      let reply = "متأسفم، هنوز درباره این موضوع چیزی یاد نگرفته‌ام 🍑 (می‌تونی بگی: برنامه نویسی، هوش مصنوعی، کسب و کار، روانشناسی، آشپزی و...)";
      
      // جستجوی کلیدواژه در آبجکت
      for (const key in kbObj) {
        if (text.includes(key)) {
          reply = kbObj[key];
          break;
        }
      }

      setTimeout(() => {
        chat.innerHTML += `<div class="msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 400);

      chat.scrollTop = chat.scrollHeight;
    }

    btn.onclick = sendMessage;

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
