<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو | هوش مصنوعی جامع و احساسی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 15px; background: #1e293b; text-align: center; font-weight: bold; color: #f59e0b; font-size: 18px; border-bottom: 1px solid #334155; flex-shrink: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 5px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; animation: fade 0.3s; white-space: pre-wrap; word-break: break-word; }
    .bot { background: #fff; color: #0f172a; align-self: flex-start; border-top-left-radius: 2px; }
    .user { background: linear-gradient(135deg, #1e40af, #38bdf8); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
    .input-box { padding: 12px 15px; margin: 0 15px 60px 15px; background: #1e293b; display: flex; gap: 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; background: #334155; color: #fff; font-size: 14px; }
    button#send { padding: 10px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>گردآلو | جامع‌ترین هوش مصنوعی (علمی + احساسی)</header>
  
  <div id="chat">
    <div class="msg bot">سلام! من گردآلو هستم. حالا علاوه بر موضوعات علمی و تخصصی، می‌تونم درباره احساساتت هم باهام حرف بزنی. حالت چطوره؟ 🍑❤️</div>
  </div>

  <div class="input-box">
    <input id="i" placeholder="هر چی توی دلت داری بگو..." autocomplete="off">
    <button id="send" onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    // ====== ۱. دیکشنری جامع (علمی + احساسی) ======
    const globalKb = {
      // --- دسته‌بندی‌های علمی ---
      "فیزیک": "فیزیک علم مطالعه ماده، انرژی و نیروهای بنیادی جهان است. از قوانین حرکت نیوتن تا نسبیت انیشتین و مکانیک کوانتوم را شامل می‌شود. ⚛️",
      "شیمی": "شیمی علم مطالعه مواد، ساختار و واکنش‌های آن‌هاست. از عناصر جدول تناوبی تا واکنش‌های آلی و معدنی. 🧪",
      "زیست شناسی": "زیست‌شناسی علم مطالعه موجودات زنده است. از سلول‌های کوچک تا اکوسیستم‌های بزرگ. 🧬",
      "هوش مصنوعی": "هوش مصنوعی (AI) شاخه‌ای از علوم کامپیوتر است که به ماشین‌ها توانایی یادگیری، استدلال و تصمیم‌گیری می‌دهد. 🤖",
      "برنامه نویسی": "برنامه‌نویسی هنر نوشتن دستورات برای کامپیوتر است. زبان‌هایی مثل پایتون پایه ساخت نرم‌افزارها هستند. 🧑🏻‍💻",
      "پزشکی": "پزشکی علم تشخیص و درمان بیماری‌هاست. 🩺",
      "روانشناسی": "روانشناسی علم مطالعه ذهن و رفتار انسان است. به درک احساسات و بهبود کیفیت زندگی کمک می‌کند. 🧠",
      "تاریخ": "تاریخ مطالعه گذشته انسان است. از تمدن‌های باستانی تا رویدادهای معاصر. 🏛️",
      "فلسفه": "فلسفه علم پرسش از بنیادی‌ترین مسائل هستی، معرفت و اخلاق است. 🤔",
      "اقتصاد": "اقتصاد علم مطالعه تولید، توزیع و مصرف منابع است. 📈",
      "موسیقی": "موسیقی زبان جهانی احساسات است. 🎵",
      "سینما": "سینما هنر هفتم است. 🎬",
      "مسی": "لیونل مسی، اسطوره فوتبال آرژانتین و برنده ۸ توپ طلا است. 🇦🇷⚽",
      "رونالدو": "کریستیانو رونالدو، ستاره پرتغالی و برنده ۵ توپ طلا است. 🇵🇹⚽",
      "سایت زردآلو": "سایت زردآلو یک بازار آنلاین برای خرید و فروش کالاست. 🍑",
      "سلام": "سلام! خوشحالم که باهام حرف میزنی. چطور می‌تونم کمکت کنم؟ 😊",

      // --- 🌟 دسته‌بندی‌های احساسی (Emotional Categories) ---
      
      // ۱. احساسات پایه (Basic Emotions)
      "شادی": "شادی یک احساس مثبت و انرژی‌بخش است. وقتی شادی می‌کنیم، مغز هورمون‌های اندورفین و سروتونین ترشح می‌کند. برای حفظ شادی، قدردانی از چیزهای کوچک زندگی و بودن در کنار عزیزان بسیار مؤثر است. 😊",
      "غم": "غم یک احساس طبیعی و انسانی است که در واکنش به فقدان یا ناکامی تجربه می‌شود. غم را بپذیر و به خودت اجازه بده که گریه کنی. گاهی صحبت کردن با یک دوست یا نوشتن احساسات می‌تواند سبکت کند. ❤️",
      "خشم": "خشم یک احساس قدرتمند است که معمولاً وقتی مرزهایمان نقض می‌شود ظاهر می‌شود. قبل از واکنش، چند نفس عمیق بکش و سعی کن ریشه خشم را پیدا کنی. خشم مدیریت‌شده می‌تواند به تغییرات مثبت منجر شود. 😠",
      "ترس": "ترس یک مکانیزم دفاعی طبیعی است. برای غلبه بر ترس، آن را بشناس و قدم‌های کوچک به سمت چیزی که از آن می‌ترسی بردار. شجاعت یعنی حرکت کردن با وجود ترس. 😨",
      "عشق": "عشق پیچیده‌ترین و زیباترین احساس انسانی است. عشق واقعی با احترام، اعتماد و همدلی همراه است. عشق ورزیدن به دیگران و پذیرفتن عشق آن‌ها، کیفیت زندگی را بالا می‌برد. ❤️",
      "نفرت": "نفرت یک احساس منفی و مخرب است که بیشتر به خود فرد آسیب می‌زند تا دیگران. سعی کن نفرت را به درک و بخشش تبدیل کنی تا آرامش را به قلبت برگردانی. 😡",
      "تعجب": "تعجب زمانی رخ می‌دهد که با چیزی غیرمنتظره روبه‌رو می‌شویم. این احساس باعث می‌شود مغز ما هوشیارتر شود و توجه بیشتری به محیط داشته باشیم. 😲",
      
      // ۲. احساسات پیچیده (Complex Emotions)
      "حسادت": "حسادت زمانی رخ می‌دهد که چیزی را در دیگری می‌بینیم که خودمان می‌خواهیم. به جای تمرکز بر داشته‌های دیگران، بر مسیر و رشد خودت تمرکز کن. مسیر هر کس منحصر به خودش است. 😒",
      "حسرت": "حسرت یعنی غم خوردن برای چیزی که از دست رفته یا انجام نشده. گذشته را نمی‌توان تغییر داد، اما می‌توان از آن درس گرفت و در زمان حال زندگی کرد. 🌅",
      "پشیمانی": "پشیمانی یعنی آرزو می‌کنی کاش کار دیگری کرده بودی. پشیمانی اگر با درس گرفتن همراه باشد، رشد می‌آورد. خودت را ببخش و به جلو نگاه کن. 😞",
      "شرم": "شرم احساسی است که وقتی احساس می‌کنیم نقص یا اشتباهی داریم تجربه می‌کنیم. بدان که هیچ انسانی کامل نیست. اشتباهات بخشی از انسان بودن هستند. 🫣",
      "احساس گناه": "احساس گناه زمانی رخ می‌دهد که فکر می‌کنیم به کسی آسیب زده‌ایم. اگر واقعاً اشتباهی کرده‌ای، عذرخواهی کن و در صدد جبران باش. خودت را هم ببخش. 😔",
      "افتخار": "افتخار یک احساس مثبت است که وقتی به دستاوردی می‌رسیم یا ارزش‌هایمان را حفظ می‌کنیم، تجربه می‌کنیم. به خودت افتخار کن، اما مغرور نشو. 🏆",
      "امید": "امید نیروی محرکه زندگی است. حتی در تاریک‌ترین روزها، امید می‌تواند ما را به جلو ببرد. همیشه روشنایی در انتهای تونل هست. 🌅",
      "ناامیدی": "ناامیدی احساس سنگینی است که وقتی تلاش‌ها به نتیجه نمی‌رسند سراغمان می‌آید. در این لحظات، به یاد بیاور که این یک حالت گذراست. با یک دوست صحبت کن یا از یک متخصص کمک بگیر. 🌧️",
      "تنهایی": "تنهایی یک احساس درونی است که حتی در میان جمع هم ممکن است تجربه شود. برای مقابله با آن، ارتباط با عزیزان، شرکت در فعالیت‌های گروهی و مراقبت از خود بسیار مؤثر است. 🫂",
      "دلتنگی": "دلتنگی برای کسی یا چیزی که دور است، یک احساس عمیق انسانی است. با تماس تلفنی، ویدیو کال یا نوشتن نامه، می‌توانی این فاصله را کمتر کنی. 📞",
      "عصبانیت": "عصبانیت شبیه خشم است اما معمولاً شدت کمتری دارد. اگر چیزی آزارت می‌دهد، با آرامش و قاطعیت آن را بیان کن. 😤",
      "استرس": "استرس واکنش بدن به فشارهای روانی است. تنفس عمیق، ورزش و برنامه‌ریزی می‌تواند استرس را کاهش دهد. به خودت استراحت بده. 😰",
      "اضطراب": "اضطراب ترس از آینده و اتفاقات پیش‌رو است. تمرکز بر زمان حال و تمرین ذهن‌آگاهی (Mindfulness) می‌تواند به کاهش آن کمک کند. 🧘",
      "افسردگی": "افسردگی یک بیماری جدی است که نیاز به درمان دارد. اگر احساس ناامیدی طولانی داری، حتماً با یک روانشناس صحبت کن. تو تنها نیستی. ❤️",
      
      // ۳. احساسات اجتماعی (Social Emotions)
      "همدلی": "همدلی توانایی درک و احساس کردن تجربه دیگران است. همدلی پایه ارتباطات سالم انسانی است. 🤝",
      "دلسوزی": "دلسوزی یعنی اهمیت دادن به رنج دیگران و تلاش برای کاهش آن. دلسوزی بدون ترحم، نشانه قدرت است. ❤️",
      "قدردانی": "قدردانی یعنی شکرگزاری برای چیزهایی که داری. قدردانی روزانه، شادی و رضایت را به شدت افزایش می‌دهد. 🙏",
      "احساس تعلق": "احساس تعلق یعنی حس اینکه بخشی از یک گروه، خانواده یا جامعه هستی. این احساس به سلامت روان کمک می‌کند. 🏠",
      "عذاب وجدان": "عذاب وجدان یعنی احساس ناراحتی شدید به خاطر کار اشتباهی که کرده‌ای. اگر می‌توانی جبران کن، و اگر نه، از آن درس بگیر و خودت را ببخش. 😔",
      "حسادت سالم": "حسادت سالم یعنی دیدن موفقیت دیگران و استفاده از آن به عنوان انگیزه برای رشد خودت. 🏃",
      "پذیرش": "پذیرش یعنی قبول کردن واقعیت‌ها بدون مقاومت. پذیرش اولین قدم برای آرامش است. 🧘",
      "بخشش": "بخشش یعنی رها کردن کینه و خشم نسبت به کسی که به تو آسیب زده. بخشش بیشتر برای آرامش خودت است تا طرف مقابل. 🕊️",
      
      // ۴. احساسات مرتبط با روابط
      "اعتماد": "اعتماد پایه هر رابطه‌ای است. با صداقت و وفاداری ساخته می‌شود و به راحتی از بین می‌رود. 🤝",
      "خیانت": "خیانت شکستن اعتماد در یک رابطه است. مواجهه با آن بسیار دردناک است، اما با زمان و حمایت می‌توان التیام یافت. 💔",
      "دوستی": "دوستی یعنی در کنار هم بودن در سختی و خوشی. دوستان خوب گنج هستند. 🤝",
      "تنفر از خود": "تنفر از خود یک احساس مخرب است. سعی کن با خودت مهربان‌تر باشی. هیچ‌کس کامل نیست. خودت را همان‌طور که هستی بپذیر. ❤️",
      "عشق به خود": "عشق به خود یعنی احترام گذاشتن به خودت و مراقبت از سلامت جسم و روانت. خودت را همان‌طور که هستی دوست بدار. 💖"
    };

    // ====== ۲. تولید ترکیبات بیشتر ======
    const finalKb = { ...globalKb };
    const subjects = Object.keys(globalKb);
    const actions = ["چیه", "چیست", "چطور کار می‌کند", "چه فایده‌ای دارد", "چگونه شروع کنم", "مزایا و معایب", "چطور کنترل کنم", "چطور غلبه کنم"];

    subjects.forEach(sub => {
      actions.forEach(act => {
        const key = `${sub} ${act}`;
        if (!finalKb[key]) {
          finalKb[key] = `درباره «${sub}»: این موضوع یکی از احساسات یا مفاهیم مهم انسانی است. برای درک بهتر آن، پیشنهاد می‌کنم با یک دوست یا مشاور صحبت کنید و از منابع معتبر روانشناسی استفاده کنید. 🍑`;
        }
      });
    });

    // ====== ۳. موتور پاسخ‌دهی هوشمند ======
    const chat = document.getElementById('chat');
    const input = document.getElementById('i');

    function findBestMatch(text) {
      text = text.toLowerCase().trim();
      
      if (finalKb[text]) return finalKb[text];
      
      // پیدا کردن طولانی‌ترین کلمه کلیدی موجود در متن
      let bestKey = null;
      let maxLength = 0;
      for (const key in finalKb) {
        if (text.includes(key) && key.length > maxLength) {
          maxLength = key.length;
          bestKey = key;
        }
      }
      if (bestKey) return finalKb[bestKey];

      // جستجوی ریشه کلمه (۴ حرف اول)
      for (const key in finalKb) {
        if (key.length > 3) {
          const root = key.slice(0, 4);
          if (text.includes(root)) {
            return finalKb[key];
          }
        }
      }
      
      return null;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';

      let reply = findBestMatch(text);

      // اگر پاسخ پیدا نشد، یک پاسخ هوشمند و احساسی تولید کن
      if (!reply) {
        reply = `من این جمله رو کاملاً درک می‌کنم. گاهی کلمات نمی‌تونن همه احساسات ما رو توصیف کنن. اگر دوست داری بیشتر صحبت کنی، من اینجام تا بشنوم. همچنین می‌تونی درباره یک احساس خاص (مثل شادی، غم، استرس یا امید) از من بپرسی تا بیشتر راهنمایی‌ت کنم. ❤️`;
      }

      setTimeout(() => {
        chat.innerHTML += `<div class="msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
