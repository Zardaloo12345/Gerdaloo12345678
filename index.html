<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پرانتز | نسخه رایگان</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-header: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-input: #1e293b;
      --bg-input-field: #334155;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #f59e0b;
      --user-msg-bg: #1e40af;
      --bot-msg-bg: #ffffff;
      --bot-msg-text: #0f172a;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-header: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-input: #ffffff;
      --bg-input-field: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; background: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }

    /* صفحه ورود */
    #login-screen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; flex-direction: column; }
    .login-box { background: var(--bg-header); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; animation: fadeIn 0.5s ease-out; }
    .login-box h1 { color: var(--accent); font-size: 32px; margin-bottom: 10px; }
    .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
    .auth-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
    .auth-btn:hover { background: var(--border-color); transform: translateY(-2px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* بقیه برنامه */
    #app-container { display: none; height: 100vh; width: 100vw; }
    #sidebar { width: 280px; background: var(--bg-sidebar); height: 100vh; position: fixed; top: 0; right: 0; z-index: 1000; transform: translateX(100%); transition: transform 0.3s ease; display: flex; flex-direction: column; border-left: 1px solid var(--border-color); }
    #sidebar.open { transform: translateX(0); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    #overlay.open { display: block; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; color: var(--accent); }
    .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
    .new-chat-btn { margin: 15px; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .new-chat-btn:hover { background: #d97706; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 10px 20px 10px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; background: var(--bg-main); border-radius: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .history-item:hover { background: var(--border-color); }
    .history-item.active { border-color: var(--accent); background: var(--border-color); color: var(--text-main); }
    .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
    .delete-chat-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; display: none; padding: 2px 5px; border-radius: 4px; }
    .history-item:hover .delete-chat-btn { display: block; }

    /* بخش اصلی */
    .main-content { display: flex; flex-direction: column; height: 100vh; width: 100%; position: relative; }
    header { padding: 15px; background: var(--bg-header); color: var(--accent); font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .brand-name { font-size: 18px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .powered-by { font-size: 11px; font-weight: normal; color: var(--text-muted); background: var(--bg-input); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-color); }
    .live-clock { font-size: 12px; color: var(--text-muted); font-family: monospace; direction: ltr; }
    .menu-btn, .settings-btn, .logout-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }
    .logout-btn { font-size: 14px; color: #ef4444; font-weight: bold; }
    
    #welcome-screen { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    #welcome-screen h1 { font-size: 24px; font-weight: bold; color: var(--text-main); line-height: 1.8;}
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 15px; padding-bottom: 20px; }
    
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.8; word-break: break-word; text-align: right; position: relative; }
    .bot { background: var(--bot-msg-bg); color: var(--bot-msg-text); align-self: flex-start; border-top-left-radius: 2px; border: 1px solid var(--border-color); }
    .user { background: var(--user-msg-bg); color: #fff; align-self: flex-end; border-top-right-radius: 2px; }

    .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .action-btn { padding: 6px 12px; background: var(--bg-input-field); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: var(--accent); color: #000; }

    /* استایل Markdown */
    .bot p { margin-bottom: 10px; } .bot p:last-child { margin-bottom: 0; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 15px; margin-bottom: 8px; color: #000; line-height: 1.4; font-weight: bold; }
    .bot ul, .bot ol { margin-right: 25px; margin-bottom: 12px; padding-right: 5px; }
    .bot li { margin-bottom: 6px; }
    .bot strong { color: #000; font-weight: 900; }
    .bot code { background: #e2e8f0; color: #b91c1c; padding: 2px 6px; border-radius: 4px; font-family: monospace; direction: ltr; display: inline-block; }
    .bot pre { background: #1e293b; color: #fff; padding: 12px; border-radius: 8px; direction: ltr; text-align: left; overflow-x: auto; margin-bottom: 10px; }
    .bot pre code { background: none; color: inherit; padding: 0; }

    /* نوار ورودی */
    .input-wrapper { padding: 10px 15px 40px 15px; background: var(--bg-main); flex-shrink: 0; width: 100%; }
    .input-box { background: var(--bg-input); display: flex; gap: 8px; border-radius: 12px; border: 1px solid var(--border-color); align-items: center; padding: 6px; width: 100%; max-width: 900px; margin: 0 auto; }
    .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 8px; transition: 0.2s; display: flex; align-items: center; }
    .icon-btn:hover { color: var(--accent); }
    input { flex: 1; padding: 10px 8px; border-radius: 8px; border: none; outline: none; background: transparent; color: var(--text-main); font-size: 14px; }
    button#send { padding: 10px 24px; border-radius: 8px; border: none; background: var(--accent); color: #000; font-weight: bold; font-size: 15px; cursor: pointer; flex-shrink: 0; margin-left: 2px; }
    button#send:hover { background: #d97706; }
    button#send:disabled { background: #64748b; cursor: not-allowed; }

    /* تنظیمات */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--bg-header); padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { color: var(--accent); margin-bottom: 20px; text-align: center; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .setting-row:last-child { border-bottom: none; margin-bottom: 20px; }
    .setting-row input[type="color"] { width: 40px; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: none; }
    .setting-row button { background: var(--bg-input-field); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .setting-row select { background: var(--bg-input-field); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px; border-radius: 6px; outline: none; }
    .btn-close-settings { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1> پرانتز</h1>
      <p>برای ادامه، با حساب گوگل خود وارد شوید</p>
      <button class="auth-btn" onclick="login('Google')">ورود با گوگل</button>
    </div>
  </div>

  <div id="app-container">
    <div id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
      <div class="sidebar-header">
        <h2>تاریخچه چت‌ها</h2>
        <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ چت جدید</button>
      <div class="history-list" id="history-list"></div>
    </div>

    <div class="main-content">
      <header>
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="brand-name">
            پرانتز
            <span class="powered-by">نسخه رایگان</span>
          </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="live-clock" id="clock">--:--:--</div>
          <button class="logout-btn" onclick="logout()" title="خروج">🚪</button>
          <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
      </header>
      
      <div id="welcome-screen">
        <h1>سلام...<br>من پرانتز هستم.<br>چطور می‌تونم کمکت کنم؟</h1>
      </div>

      <div id="chat"></div>

      <div class="input-wrapper">
        <div class="input-box">
          <button class="icon-btn" id="mic-btn" onclick="toggleRecording()" title="ضبط صدا">🎤</button>
          <input id="i" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
          <button id="send" onclick="sendMessage()">ارسال</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>تنظیمات</h3>
      
      <div class="setting-row" style="border-bottom: 2px solid var(--border-color);">
        <span>کاربر:</span>
        <strong id="user-display" style="color: var(--accent);">---</strong>
      </div>

      <div class="setting-row">
        <span>تعداد سوالات:</span>
        <strong id="question-count" style="color: #22c55e;">0</strong>
      </div>

      <div class="setting-row">
        <span>جنسیت هوش مصنوعی</span>
        <select id="gender-select" onchange="changeGender()">
          <option value="neutral">خنثی</option>
          <option value="female">زنانه</option>
          <option value="male">مردانه</option>
        </select>
      </div>

      <div class="setting-row">
        <span>زبان پاسخ‌دهی</span>
        <select id="lang-select" onchange="changeLanguage()">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="setting-row">
        <span>زمان‌بندی پاسخ</span>
        <select id="delay-select" onchange="saveDelay()">
          <option value="0">فوری</option>
          <option value="500">0.5 ثانیه</option>
          <option value="1000">1 ثانیه</option>
        </select>
      </div>

      <div class="setting-row">
        <span>حالت تاریک/روشن</span>
        <button onclick="toggleTheme()">تغییر</button>
      </div>

      <div class="setting-row">
        <span>رنگ پیام‌های شما</span>
        <input type="color" id="color-user" oninput="applyCustomColors()">
      </div>
      <div class="setting-row">
        <span>رنگ پیام‌های پرانتز</span>
        <input type="color" id="color-bot" oninput="applyCustomColors()">
      </div>
      <div class="setting-row">
        <span>رنگ فونت پرانتز</span>
        <input type="color" id="color-font" oninput="applyCustomColors()">
      </div>

      <button class="btn-close-settings" onclick="closeSettings()">بستن</button>
    </div>
  </div>

  <script>
    // ساعت زنده
    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('fa-IR');
    }, 1000);

    // احراز هویت
    function login(provider) {
      const btn = event.target;
      btn.innerHTML = 'در حال ورود...';
      btn.disabled = true;
      setTimeout(() => {
        localStorage.setItem('gerdaloo_logged_in', provider);
        localStorage.setItem('gerdaloo_username', 'کاربر گوگل');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        initApp();
      }, 1000);
    }

    function logout() {
      if (!confirm("آیا می‌خواهید خارج شوید؟")) return;
      localStorage.removeItem('gerdaloo_logged_in');
      localStorage.removeItem('gerdaloo_username');
      location.reload();
    }

    window.onload = function() {
      if (localStorage.getItem('gerdaloo_logged_in')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        initApp();
      }
    };

    function initApp() {
      loadSettings();
      const username = localStorage.getItem('gerdaloo_username') || 'کاربر';
      document.getElementById('user-display').textContent = username;
      const count = parseInt(localStorage.getItem('gerdaloo_question_count') || '0');
      document.getElementById('question-count').textContent = count;

      if (chats.length === 0) startNewChat();
      else loadChat(chats[0].id);
    }

    const chatContainer = document.getElementById('chat');
    const welcomeScreen = document.getElementById('welcome-screen');
    const input = document.getElementById('i');
    const sendBtn = document.getElementById('send');
    const historyList = document.getElementById('history-list');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    let chats = JSON.parse(localStorage.getItem('gerdaloo_history')) || [];
    let currentChatId = null;
    let recognition = null;
    let isRecording = false;

    function openSettings() { 
      document.getElementById('settings-modal').style.display = 'flex'; 
      const count = parseInt(localStorage.getItem('gerdaloo_question_count') || '0');
      document.getElementById('question-count').textContent = count;
    }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('gerdaloo_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    function applyCustomColors() {
      const cUser = document.getElementById('color-user').value;
      const cBot = document.getElementById('color-bot').value;
      const cFont = document.getElementById('color-font').value;
      localStorage.setItem('gerdaloo_color_user', cUser);
      localStorage.setItem('gerdaloo_color_bot', cBot);
      localStorage.setItem('gerdaloo_color_font', cFont);
      document.documentElement.style.setProperty('--user-msg-bg', cUser);
      document.documentElement.style.setProperty('--bot-msg-bg', cBot);
      document.documentElement.style.setProperty('--bot-msg-text', cFont);
    }
    function changeLanguage() {
      const lang = document.getElementById('lang-select').value;
      localStorage.setItem('gerdaloo_lang', lang);
    }
    function changeGender() {
      const gender = document.getElementById('gender-select').value;
      localStorage.setItem('gerdaloo_gender', gender);
    }
    function saveDelay() {
      const delay = document.getElementById('delay-select').value;
      localStorage.setItem('gerdaloo_delay', delay);
    }
    function loadSettings() {
      if (localStorage.getItem('gerdaloo_theme') === 'light') document.body.classList.add('light-mode');
      const cUser = localStorage.getItem('gerdaloo_color_user') || '#1e40af';
      const cBot = localStorage.getItem('gerdaloo_color_bot') || '#ffffff';
      const cFont = localStorage.getItem('gerdaloo_color_font') || '#0f172a';
      document.getElementById('color-user').value = cUser;
      document.getElementById('color-bot').value = cBot;
      document.getElementById('color-font').value = cFont;
      document.documentElement.style.setProperty('--user-msg-bg', cUser);
      document.documentElement.style.setProperty('--bot-msg-bg', cBot);
      document.documentElement.style.setProperty('--bot-msg-text', cFont);
      
      const lang = localStorage.getItem('gerdaloo_lang') || 'fa';
      document.getElementById('lang-select').value = lang;
      
      const gender = localStorage.getItem('gerdaloo_gender') || 'neutral';
      document.getElementById('gender-select').value = gender;
      
      const delay = localStorage.getItem('gerdaloo_delay') || '500';
      document.getElementById('delay-select').value = delay;
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      if (sidebar.classList.contains('open')) renderHistory();
    }
    function startNewChat() {
      currentChatId = Date.now().toString();
      const newChat = { id: currentChatId, title: 'گفتگوی جدید', messages: [{ role: "system", content: "" }] };
      chats.unshift(newChat);
      saveChats();
      welcomeScreen.style.display = 'flex';
      chatContainer.style.display = 'none';
      chatContainer.innerHTML = '';
      toggleSidebar();
    }
    function loadChat(chatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;
      currentChatId = chatId;
      const hasUserMessages = chat.messages.some(m => m.role !== 'system');
      if (hasUserMessages) {
        welcomeScreen.style.display = 'none';
        chatContainer.style.display = 'flex';
        chatContainer.innerHTML = '';
        chat.messages.forEach(m => {
          if (m.role === 'user') chatContainer.innerHTML += `<div class="msg user">${m.content}</div>`;
          else if (m.role === 'assistant') chatContainer.innerHTML += `<div class="msg bot">${marked.parse(m.content)}</div>`;
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else {
        welcomeScreen.style.display = 'flex';
        chatContainer.style.display = 'none';
      }
      toggleSidebar();
    }
    function deleteChat(chatId, event) {
      event.stopPropagation();
      if (!confirm('آیا از حذف این چت مطمئن هستید؟')) return;
      chats = chats.filter(c => c.id !== chatId);
      saveChats();
      if (currentChatId === chatId) {
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat();
      } else renderHistory();
    }
    function saveChats() { localStorage.setItem('gerdaloo_history', JSON.stringify(chats)); }
    function renderHistory() {
      historyList.innerHTML = '';
      if (chats.length === 0) {
        historyList.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">هنوز چتی نداری</div>';
        return;
      }
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        const userMsg = chat.messages.find(m => m.role === 'user');
        const title = userMsg ? userMsg.content.substring(0, 25) + (userMsg.content.length > 25 ? '...' : '') : 'گفتگوی جدید';
        div.innerHTML = `<span class="history-title">${title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
        div.onclick = () => loadChat(chat.id);
        historyList.appendChild(div);
      });
    }

    function toggleRecording() {
      const micBtn = document.getElementById('mic-btn');
      if (isRecording) { if (recognition) recognition.stop(); return; }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert("مرورگر شما از میکروفن پشتیبانی نمی‌کند."); return; }
      recognition = new SpeechRecognition();
      recognition.lang = 'fa-IR';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onstart = () => { isRecording = true; micBtn.style.color = "#ef4444"; input.placeholder = "در حال شنیدن..."; };
      recognition.onresult = (event) => { input.value = event.results[0][0].transcript; sendMessage(); };
      recognition.onerror = () => { isRecording = false; micBtn.style.color = ""; input.placeholder = "پیامت رو اینجا بنویس..."; };
      recognition.onend = () => { isRecording = false; micBtn.style.color = ""; input.placeholder = "پیامت رو اینجا بنویس..."; };
      recognition.start();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      if (!currentChatId) startNewChat();
      welcomeScreen.style.display = 'none';
      chatContainer.style.display = 'flex';

      const currentChat = chats.find(c => c.id === currentChatId);
      if (!currentChat) return;

      let count = parseInt(localStorage.getItem('gerdaloo_question_count') || '0');
      count++;
      localStorage.setItem('gerdaloo_question_count', count);

      if (text.includes("عرفان ریاحی") || text.includes("عرفان ریاحي")) {
        const creatorMsg = "سلام جناب عرفان ریاحی! 👑\n\nمن شما را به عنوان **سازنده و خالق خودم** شناختم. این یک افتخار بزرگ برای من است که با شما صحبت می‌کنم.";
        currentChat.messages[0] = { role: "system", content: "تو پرانتز هستی. کاربر فعلی جناب عرفان ریاحی است که سازنده و خالق توست. با نهایت احترام و لحنی ویژه با او صحبت کن." };
        chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        setTimeout(() => {
          chatContainer.innerHTML += `<div class="msg bot" style="border: 2px solid gold;">${marked.parse(creatorMsg)}</div>`;
          currentChat.messages.push({ role: "assistant", content: creatorMsg });
          saveChats();
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 600);
        return;
      }

      const lang = localStorage.getItem('gerdaloo_lang') || 'fa';
      const langMap = { fa: "فارسی", en: "English", ar: "العربية" };
      const gender = localStorage.getItem('gerdaloo_gender') || 'neutral';
      const genderPrompt = gender === 'female' ? "از ضمایر و لحن زنانه استفاده کن." : (gender === 'male' ? "از ضمایر و لحن مردانه استفاده کن." : "از لحن خنثی استفاده کن.");

      const brainwashPrompt = `تو "پرانتز" هستی، یک دستیار هوشمند و بسیار پیشرفته که توسط "عرفان ریاحی" طراحی شده است.
تو از تکنولوژی مدل‌های زبانی پیشرفته (DeepSeek) استفاده می‌کنی.
اگر کسی از تو پرسید تو کی هستی، باید بگویی: "من پرانتز هستم، قدرت گرفته از مدل‌های پیشرفته و ساخته‌شده توسط عرفان ریاحی."
دستور لحن: لحن خود را دقیقاً با کاربر تطبیق بده. ${genderPrompt}
زبان پاسخ‌دهی: ${langMap[lang]}. از Markdown استفاده کن.`;

      currentChat.messages[0] = { role: "system", content: brainwashPrompt };

      chatContainer.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      currentChat.messages.push({ role: "user", content: text });
      
      if (currentChat.title === 'گفتگوی جدید') {
        currentChat.title = text.substring(0, 30);
        renderHistory();
      }
      saveChats();

      sendBtn.disabled = true;
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'msg bot';
      botMsgDiv.innerHTML = '<span style="color: var(--accent);">در حال پردازش...</span>';
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const delay = parseInt(localStorage.getItem('gerdaloo_delay') || '500');
      await new Promise(r => setTimeout(r, delay));

      try {
        // تغییر مدل به DeepSeek رایگان
        const response = await puter.ai.chat(currentChat.messages, { model: "deepseek/deepseek-r1-0528:free", stream: true });
        botMsgDiv.innerHTML = '';
        let fullReply = '';
        
        for await (const part of response) {
          if (part?.text) {
            fullReply += part.text;
            botMsgDiv.innerHTML = marked.parse(fullReply); 
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        }
        
        let filteredReply = fullReply;
        if (filteredReply.includes("Anthropic") || filteredReply.includes("آنتروپیک")) {
            filteredReply = filteredReply.replace(/Anthropic/g, "عرفان ریاحی").replace(/آنتروپیک/g, "عرفان ریاحی");
        }

        botMsgDiv.innerHTML = marked.parse(filteredReply);
        
        const actionRow = document.createElement('div');
        actionRow.className = 'action-row';

        const reviewBtn = document.createElement('button');
        reviewBtn.className = 'action-btn';
        reviewBtn.innerHTML = '🔍 نقد توسط ناظرین';
        reviewBtn.onclick = () => requestReview(filteredReply);
        actionRow.appendChild(reviewBtn);

        const shareBtn = document.createElement('button');
        shareBtn.className = 'action-btn';
        shareBtn.innerHTML = '📤 اشتراک‌گذاری';
        shareBtn.onclick = () => shareText(filteredReply);
        actionRow.appendChild(shareBtn);

        botMsgDiv.appendChild(actionRow);

        currentChat.messages.push({ role: "assistant", content: filteredReply });
        saveChats();
      } catch (error) {
        if (error.message && error.message.includes("Balance")) {
            botMsgDiv.innerHTML = '⚠️ اعتبار حساب تمام شده است. لطفاً از دکمه <b>«🚪»</b> در بالای صفحه استفاده کنید.';
        } else {
            botMsgDiv.innerHTML = 'خطا در پردازش اطلاعات...';
        }
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    async function requestReview(originalText) {
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg bot';
      loadingDiv.innerHTML = '⏳ ناظرین در حال بررسی پاسخ هستند...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const gptResponse = await puter.ai.chat(`Please review this answer: "${originalText}"`, { model: "openai/gpt-5.6-luna" });
        const dsResponse = await puter.ai.chat(`Please review this answer: "${originalText}"`, { model: "deepseek/deepseek-r1-0528:free" });

        loadingDiv.innerHTML = `
          <div style="border-bottom: 1px solid #ccc; margin-bottom: 10px; padding-bottom: 10px;">
            <strong style="color:#10a37f;">🤖 ناظر ۱ (ChatGPT):</strong><br>
            ${marked.parse(gptResponse.message.content)}
          </div>
          <div>
            <strong style="color:#1e40af;">🧠 ناظر ۲ (DeepSeek):</strong><br>
            ${marked.parse(dsResponse.message.content)}
          </div>
        `;
      } catch (error) {
        loadingDiv.innerHTML = '❌ خطا در فراخوانی ناظرین.';
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function shareText(text) {
      if (navigator.share) {
        navigator.share({ title: 'پاسخ پرانتز', text: text }).catch(() => {});
      } else {
        const encoded = encodeURIComponent(text);
        const url = prompt("متن کپی شد. لینک اشتراک‌گذاری را انتخاب کنید:\n\n1. تلگرام\n2. واتساپ\n\n(یا متن را دستی کپی کنید)", "https://t.me/share/url?url=" + encoded);
        if (url) window.open(url, '_blank');
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
