<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گردآلو | Gerdaloo AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 200 200" width="48" height="48">
        <circle cx="100" cy="110" r="60" fill="#e67e22" stroke="#d35400" stroke-width="4"/>
        <path d="M100 50 Q120 20 150 30 Q130 60 100 50 Z" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
        <g stroke="#fff" stroke-width="2" opacity="0.9">
          <line x1="80" y1="90" x2="100" y2="110"/>
          <line x1="120" y1="90" x2="100" y2="110"/>
          <line x1="80" y1="130" x2="100" y2="110"/>
          <line x1="120" y1="130" x2="100" y2="110"/>
          <line x1="80" y1="90" x2="120" y2="90"/>
          <line x1="80" y1="130" x2="120" y2="130"/>
        </g>
        <g fill="#fff">
          <circle cx="80" cy="90" r="5"/>
          <circle cx="120" cy="90" r="5"/>
          <circle cx="100" cy="110" r="6"/>
          <circle cx="80" cy="130" r="5"/>
          <circle cx="120" cy="130" r="5"/>
        </g>
        <path d="M145 70 L150 85 L165 80 L155 95 L160 110" stroke="#f1c40f" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>گردآلو</h1>
        <span class="logo-sub">Gerdaloo AI v2.0</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="memory-badge" id="memoryBadge" title="حافظه گردآلو">
        🧠 <span id="memoryCount">0</span>
      </div>
      <button id="voiceToggle" class="voice-toggle" title="روشن/خاموش کردن پاسخ صوتی">🔊</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>به گردآلو خوش آمدی! 🍑</h2>
      <p>دستیار هوشمند سایت زردآلو — متنی یا صوتی بپرس</p>
    </section>

    <section class="chat-box">
      <div class="chat-messages" id="chatMessages">
        <div class="message bot">
          <span class="avatar">🍑</span>
          <div class="bubble">سلام! من گردآلو هستم. می‌تونی تایپ کنی یا با میکروفن صحبت کنی 😊</div>
        </div>
      </div>

      <form class="chat-form" id="chatForm">
        <button type="button" id="micBtn" class="mic-btn" title="ضبط صدا">🎤</button>
        <input type="text" id="userInput" placeholder="پیامت را بنویس یا میکروفن را بزن..." autocomplete="off">
        <button type="submit">ارسال</button>
      </form>
    </section>

    <section class="quick-questions">
      <p>سوالات پرتکرار:</p>
      <div class="chips">
        <button class="chip" data-q="زردآلو چیه؟">زردآلو چیه؟</button>
        <button class="chip" data-q="سازنده زردآلو کیست؟">سازنده کیست؟</button>
        <button class="chip" data-q="چطور پروفایل بسازم؟">چطور پروفایل بسازم؟</button>
        <button class="chip" data-q="سبد خرید چطور کار می‌کند؟">سبد خرید</button>
        <button class="chip" data-q="آدرس سایت زردآلو چیست؟">آدرس سایت</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>ساخته‌شده با ❤️ برای پروژه گردآلو | Gerdaloo AI</p>
  </footer>

  <script src="script.js"></script>
</body>
  </html>
